services:
  mysql:
    image: mysql:8.0
    container_name: pconlineshop-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${DEV_DB_NAME:-pconlineshop}
      MYSQL_USER: ${DEV_DB_USERNAME:-pconlineshop}
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD:-123456}

    ports:
      - "${MYSQL_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

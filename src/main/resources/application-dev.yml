server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: false

app:
  base-url: ${APP_BASE_URL:http://localhost:${SERVER_PORT:8080}}

spring:
  config:
    import: optional:file:.env.dev[.properties]
  payos:
    client-id: ${PAYOS_CLIENT_ID:dev-client-id}
    api-key: ${PAYOS_API_KEY:dev-api-key}
    checksum-key: ${PAYOS_CHECKSUM_KEY:dev-checksum-key}
    log-level: ${PAYOS_LOG_LEVEL:INFO}
    base-url: ${PAYOS_BASE_URL:https://api.payos.vn}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DEV_DB_URL:jdbc:mysql://localhost:3307/pconlineshop?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DEV_DB_USERNAME:pconlineshop}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DEV_DB_PASSWORD:123456}}
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

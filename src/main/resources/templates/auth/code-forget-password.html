<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-minimal :: minimal(~{::title}, 'auth-page', ~{::main}, ~{::page-styles})}">
<head>
    <title>Enter Reset Code – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/auth.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="auth-main">

    <div class="auth-bg" aria-hidden="true">
        <div class="auth-orb auth-orb--1"></div>
        <div class="auth-orb auth-orb--2"></div>
    </div>

    <div class="auth-card">

        <div class="auth-card__brand">
            <a th:href="@{/}" class="auth-card__logo">PC<span>Shop</span></a>
        </div>

        <h1 class="auth-card__title">Enter reset code</h1>
        <p class="auth-code-hint">Enter the 6-digit code sent to your email.</p>

        <div th:if="${error}" class="auth-alert auth-alert--error" th:text="${error}"></div>

        <form th:action="@{/auth/code-forget-password}" method="post">
            <input type="hidden" name="identifier" th:value="${identifier}">

            <div class="auth-form__group">
                <label class="auth-form__label" for="code">Reset Code</label>
                <input class="auth-form__input" type="text" id="code"
                       name="code" maxlength="6"
                       placeholder="Enter 6-digit code"
                       autocomplete="one-time-code" required>
            </div>

            <button type="submit" class="auth-form__submit">Verify Code</button>
        </form>

        <div class="auth-card__footer">
            <a th:href="@{/auth/forget-password}" class="auth-back-link">← Back</a>
        </div>

    </div>

</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-minimal :: minimal(~{::title}, 'auth-page', ~{::main}, ~{::page-styles})}">
<head>
    <title>Forgot Password – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/auth.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="auth-main">

    <div class="auth-bg" aria-hidden="true">
        <div class="auth-orb auth-orb--1"></div>
        <div class="auth-orb auth-orb--2"></div>
    </div>

    <div class="auth-card">

        <div class="auth-card__brand">
            <a th:href="@{/}" class="auth-card__logo">PC<span>Shop</span></a>
        </div>

        <h1 class="auth-card__title">Forgot password?</h1>
        <p class="auth-card__subtitle">Enter your email and we'll send a reset code</p>

        <div th:if="${error}" class="auth-alert auth-alert--error" th:text="${error}"></div>

        <form th:action="@{/auth/forget-password}" method="post">
            <div class="auth-form__group">
                <label class="auth-form__label" for="identifier">Email Address</label>
                <input class="auth-form__input" type="text" id="identifier"
                       name="identifier" placeholder="example@gmail.com" required>
            </div>

            <button type="submit" class="auth-form__submit">Send Reset Code</button>
        </form>

        <div class="auth-card__footer">
            <a th:href="@{/auth/login}" class="auth-back-link">← Back to login</a>
        </div>

    </div>

</main>
</body>
</html>

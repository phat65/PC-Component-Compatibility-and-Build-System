<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-minimal :: minimal(~{::title}, 'auth-page', ~{::main}, ~{::page-styles})}">
<head>
    <title>Login – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/auth.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="auth-main">

    <div class="auth-bg" aria-hidden="true">
        <div class="auth-orb auth-orb--1"></div>
        <div class="auth-orb auth-orb--2"></div>
    </div>

    <div class="auth-card">

        <div class="auth-card__brand">
            <a th:href="@{/}" class="auth-card__logo">PC<span>Shop</span></a>
        </div>

        <h1 class="auth-card__title">Welcome back</h1>
        <p class="auth-card__subtitle">Sign in to your account to continue</p>

        <div th:if="${param.error}" class="auth-alert auth-alert--error">
            ⚠ Phone number or password incorrect.
        </div>

        <form th:action="@{/auth/login}" method="post">
            <input type="hidden" name="redirect" th:if="${param.redirect}" th:value="${param.redirect}">

            <div class="auth-form__group">
                <label class="auth-form__label" for="phoneNumber">Phone Number</label>
                <input class="auth-form__input"
                       type="text" id="phoneNumber" name="phoneNumber"
                       placeholder="0912 345 678" required
                       th:value="${phoneNumber != null} ? ${phoneNumber} : ''">
            </div>

            <div class="auth-form__group">
                <label class="auth-form__label" for="password">Password</label>
                <input class="auth-form__input"
                       type="password" id="password" name="password"
                       placeholder="Enter password" required>
            </div>

            <div class="auth-form__check-row">
                <label>
                    <input type="checkbox" name="remember-me"> Remember me
                </label>
                <a th:href="@{/auth/forget-password}" class="auth-link">Forgot password?</a>
            </div>

            <button type="submit" class="auth-form__submit">Sign In</button>
        </form>

        <div class="auth-card__footer">
            No account yet? <a th:href="@{/auth/register}" class="auth-link">Create one</a>
        </div>

    </div>

</main>
</body>
</html>

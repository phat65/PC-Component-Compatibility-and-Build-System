<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Login', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/pages/auth.css}">

    <section class="auth-page auth-page--login">
        <div class="auth-shell auth-shell--single">
            <div class="auth-card">
                <div class="auth-card__header">
                    <h2>Login</h2>
                    <p>Use the phone number registered with your account.</p>
                </div>

                <div th:if="${param.error}" class="auth-alert auth-alert--error" role="alert">
                    Phone number or password is incorrect.
                </div>
                <div th:if="${param.success}" class="auth-alert auth-alert--success" role="status">
                    Account verified. You can login now.
                </div>
                <div th:if="${param.resetSuccess}" class="auth-alert auth-alert--success" role="status">
                    Password updated. Please login with your new password.
                </div>
                <div th:if="${param.logout}" class="auth-alert auth-alert--success" role="status">
                    You have been logged out.
                </div>
                <div th:if="${param.required}" class="auth-alert auth-alert--warning" role="alert">
                    Please login before continuing.
                </div>

                <form class="auth-form" th:action="@{/auth/login}" method="post">
                    <input type="hidden" name="redirect" th:if="${param.redirect}" th:value="${param.redirect}">

                    <div class="auth-field">
                        <label for="phoneNumber">Phone number</label>
                        <input class="auth-input"
                               type="text"
                               id="phoneNumber"
                               name="phoneNumber"
                               inputmode="tel"
                               autocomplete="tel"
                               placeholder="0912345678"
                               required
                               th:value="${phoneNumber != null} ? ${phoneNumber} : ''">
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input class="auth-input"
                               type="password"
                               id="password"
                               name="password"
                               autocomplete="current-password"
                               placeholder="Enter your password"
                               required>
                    </div>

                    <div class="auth-form__row auth-form__row--end">
                        <a th:href="@{/auth/forget-password}" class="auth-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="auth-button">Login</button>
                </form>

                <p class="auth-switch">
                    No account yet?
                    <a th:href="@{/auth/register}">Create an account</a>
                </p>
            </div>
        </div>
    </section>
</th:block>
</body>
</html>

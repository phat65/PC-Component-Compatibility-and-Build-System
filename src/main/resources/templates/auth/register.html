<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Register', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/pages/auth.css}">

    <section class="auth-page auth-page--register">
        <div class="auth-shell auth-shell--single auth-shell--register">
            <div class="auth-card auth-card--register">
                <div class="auth-card__header">
                    <h2>Register</h2>
                    <p>Create an account and verify your email before login.</p>
                </div>

                <form class="auth-form" th:action="@{/auth/register}" th:object="${account}" method="post" onsubmit="return validatePassword()">
                    <div class="auth-grid auth-grid--two">
                        <div class="auth-field">
                            <label for="firstname">First name</label>
                            <input class="auth-input"
                                   type="text"
                                   id="firstname"
                                   th:field="*{firstname}"
                                   autocomplete="given-name"
                                   placeholder="First name"
                                   required>
                        </div>

                        <div class="auth-field">
                            <label for="lastname">Last name</label>
                            <input class="auth-input"
                                   type="text"
                                   id="lastname"
                                   th:field="*{lastname}"
                                   autocomplete="family-name"
                                   placeholder="Last name"
                                   required>
                        </div>
                    </div>

                    <div class="auth-grid auth-grid--two">
                        <div class="auth-field">
                            <label for="gender">Gender</label>
                            <select class="auth-input" id="gender" th:field="*{gender}">
                                <option value="">Select gender</option>
                                <option value="true">Male</option>
                                <option value="false">Female</option>
                            </select>
                        </div>

                        <div class="auth-field">
                            <label for="phoneNumber">Phone number</label>
                            <input class="auth-input"
                                   type="text"
                                   id="phoneNumber"
                                   th:field="*{phoneNumber}"
                                   inputmode="tel"
                                   autocomplete="tel"
                                   placeholder="0912345678"
                                   required>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="email">Email</label>
                        <input class="auth-input"
                               type="email"
                               id="email"
                               th:field="*{email}"
                               autocomplete="email"
                               placeholder="example@gmail.com"
                               required>
                    </div>

                    <div class="auth-field">
                        <label>Address</label>
                        <div class="auth-address">
                            <select id="province" class="auth-input">
                                <option value="">Province</option>
                            </select>

                            <select id="district" class="auth-input">
                                <option value="">District</option>
                            </select>

                            <select id="ward" class="auth-input">
                                <option value="">Ward</option>
                            </select>
                        </div>
                        <input class="auth-input auth-input--manual"
                               type="text"
                               id="manualAddress"
                               placeholder="Type your full address"
                               autocomplete="street-address"
                               aria-label="Manual address">
                        <input type="hidden" id="address" th:field="*{address}">
                        <p id="addressHelp" class="auth-help">Choose province, district, and ward. Manual address is available if lookup fails.</p>
                    </div>

                    <div class="auth-grid auth-grid--two">
                        <div class="auth-field">
                            <label for="password">Password</label>
                            <input class="auth-input"
                                   type="password"
                                   id="password"
                                   th:field="*{password}"
                                   autocomplete="new-password"
                                   placeholder="At least 6 characters"
                                   required>
                        </div>

                        <div class="auth-field">
                            <label for="confirmPassword">Confirm password</label>
                            <input class="auth-input"
                                   type="password"
                                   id="confirmPassword"
                                   th:field="*{confirmPassword}"
                                   autocomplete="new-password"
                                   placeholder="Repeat password"
                                   required>
                        </div>
                    </div>

                    <p id="errorText"
                       class="auth-alert auth-alert--error auth-alert--compact"
                       th:classappend="${error == null} ? ' auth-alert--hidden' : ''"
                       th:text="${error}"></p>

                    <button type="submit" class="auth-button">Create account</button>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a th:href="@{/auth/login}">Login</a>
                </p>
            </div>
        </div>
    </section>

    <script th:src="@{/js/register.js}"></script>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-minimal :: minimal(~{::title}, 'auth-page', ~{::main}, ~{::page-styles})}">
<head>
    <title>Register – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/auth.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="auth-main">

    <div class="auth-bg" aria-hidden="true">
        <div class="auth-orb auth-orb--1"></div>
        <div class="auth-orb auth-orb--2"></div>
    </div>

    <div class="auth-card" style="max-width:520px;">

        <div class="auth-card__brand">
            <a th:href="@{/}" class="auth-card__logo">PC<span>Shop</span></a>
        </div>

        <h1 class="auth-card__title">Create account</h1>
        <p class="auth-card__subtitle">Join us and build your dream PC</p>

        <div th:if="${error}" class="auth-alert auth-alert--error" th:text="${error}"></div>

        <form th:action="@{/auth/register}" th:object="${account}" method="post"
              onsubmit="return validatePassword()">

            <div class="auth-form__group">
                <label class="auth-form__label" for="firstname">First Name</label>
                <input class="auth-form__input" type="text" id="firstname"
                       th:field="*{firstname}" placeholder="First name" required>
            </div>

            <div class="auth-form__group">
                <label class="auth-form__label" for="lastname">Last Name</label>
                <input class="auth-form__input" type="text" id="lastname"
                       th:field="*{lastname}" placeholder="Last name" required>
            </div>

            <div class="auth-form__group">
                <label class="auth-form__label" for="gender">Gender</label>
                <select class="auth-form__select" id="gender" th:field="*{gender}">
                    <option value="">-- Select --</option>
                    <option value="true">Male</option>
                    <option value="false">Female</option>
                </select>
            </div>

            <div class="auth-form__group">
                <label class="auth-form__label">Address</label>
                <div class="auth-form__address-row">
                    <select id="province" class="auth-form__select">
                        <option value="">-- Province --</option>
                    </select>
                    <select id="district" class="auth-form__select">
                        <option value="">-- District --</option>
                    </select>
                    <select id="ward" class="auth-form__select">
                        <option value="">-- Ward --</option>
                    </select>
                </div>
                <input type="hidden" id="address" th:field="*{address}">
            </div>

            <div class="auth-form__group">
                <label class="auth-form__label" for="email">Email</label>
                <input class="auth-form__input" type="email" id="email"
                       th:field="*{email}" placeholder="example@gmail.com" required>
            </div>

            <div class="auth-form__group">
                <label class="auth-form__label" for="phoneNumber">Phone Number</label>
                <input class="auth-form__input" type="text" id="phoneNumber"
                       th:field="*{phoneNumber}" placeholder="0912 345 678" required>
            </div>

            <div class="auth-form__group">
                <label class="auth-form__label" for="password">Password</label>
                <input class="auth-form__input" type="password" id="password"
                       th:field="*{password}" placeholder="Create a password" required>
            </div>

            <div class="auth-form__group">
                <label class="auth-form__label" for="confirmPassword">Confirm Password</label>
                <input class="auth-form__input" type="password" id="confirmPassword"
                       name="confirmPassword" placeholder="Repeat password" required>
            </div>

            <p id="errorText" class="auth-alert auth-alert--error"
               style="display:none;" th:style="${error != null} ? 'display:flex;' : 'display:none;'"
               th:text="${error}"></p>

            <button type="submit" class="auth-form__submit">Create Account</button>
        </form>

        <div class="auth-card__footer">
            Already have an account? <a th:href="@{/auth/login}" class="auth-link">Sign in</a>
        </div>

    </div>

    <script src="/js/register.js"></script>
</main>
</body>
</html>

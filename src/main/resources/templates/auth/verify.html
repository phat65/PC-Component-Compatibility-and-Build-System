<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-minimal :: minimal(~{::title}, 'auth-page', ~{::main}, ~{::page-styles})}">
<head>
    <title>Verify Email – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/auth.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="auth-main">

    <div class="auth-bg" aria-hidden="true">
        <div class="auth-orb auth-orb--1"></div>
        <div class="auth-orb auth-orb--2"></div>
    </div>

    <div class="auth-card">

        <div class="auth-card__brand">
            <a th:href="@{/}" class="auth-card__logo">PC<span>Shop</span></a>
        </div>

        <h1 class="auth-card__title">Verify your email</h1>

        <p class="auth-code-hint">
            A 6-digit code was sent to
            <strong th:text="${email != null ? email : param.email}">example@gmail.com</strong>.
            Please enter it below.
        </p>

        <div th:if="${error}" class="auth-alert auth-alert--error" th:text="${error}"></div>
        <div th:if="${success}" class="auth-alert auth-alert--success" th:text="${success}"></div>

        <form th:action="@{/auth/verify}" method="post">
            <input type="hidden" name="email" th:value="${email != null ? email : param.email}">

            <div class="auth-form__group">
                <label class="auth-form__label" for="code">Verification Code</label>
                <input class="auth-form__input" type="text" id="code" name="code"
                       placeholder="Enter 6-digit code" maxlength="6"
                       autocomplete="one-time-code" required>
            </div>

            <button type="submit" class="auth-form__submit">Verify</button>
        </form>

        <div class="auth-card__footer">
            <a th:href="@{/auth/verify(email=${email != null ? email : param.email})}"
               class="auth-link">Resend code</a>
            &nbsp;·&nbsp;
            <a th:href="@{/auth/login}" class="auth-back-link">← Back to login</a>
        </div>

    </div>

</main>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page page-blog',
          ~{::main},
          ~{::page-styles},
          ${false}
      )}">
<head>
    <title>Blog – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/blog.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="blog-main">
    <div class="blog-container">

        <a th:href="@{/}" class="blog-back-link">← Home</a>

        <div class="blog-page-header">
            <p class="blog-page-header__eyebrow">News &amp; Updates</p>
            <h1 class="blog-page-header__title">
                Blog from <span th:text="${sourceName}">HACOM</span>
            </h1>
            <p class="blog-source-info">
                Source:
                <a th:href="${sourceUrl}" target="_blank" rel="noopener" th:text="${sourceUrl}"></a>
            </p>
        </div>

        <div th:if="${#lists.isEmpty(links)}" class="blog-empty">
            <p>Could not load articles. Please try again later.</p>
        </div>

        <div class="blog-grid" th:if="${!#lists.isEmpty(links)}">
            <article th:each="link : ${links}" class="blog-card">
                <a class="blog-card__image-wrap"
                   th:href="${link.link}" target="_blank" rel="noopener">
                    <img th:if="${link.imageUrl != null}"
                         th:src="${link.imageUrl}"
                         alt="Article thumbnail"
                         class="blog-card__image">
                </a>
                <div class="blog-card__body">
                    <p class="blog-card__meta">
                        Source: <a th:href="${sourceUrl}" target="_blank" rel="noopener">HACOM</a>
                    </p>
                    <h2 class="blog-card__title">
                        <a th:href="${link.link}" target="_blank" rel="noopener"
                           th:text="${link.title}">Article title</a>
                    </h2>
                    <p th:if="${link.summary != null}" class="blog-card__summary"
                       th:text="${link.summary}"></p>
                    <a th:href="${link.link}" target="_blank" rel="noopener"
                       class="blog-card__read-more">Read more →</a>
                </div>
            </article>
        </div>

    </div>
</main>
</body>
</html>

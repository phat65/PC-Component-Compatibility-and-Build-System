<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Brand Form', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <section class="commerce-page admin-page">
        <div class="container">
            <div class="section-header">
                <h1 class="commerce-title app-mb-0" th:text="${isEdit} ? 'Edit Brand' : 'Add Brand'">Brand</h1>
                <a th:href="@{/admin/brand/list}" class="btn btn-app-outline">Back</a>
            </div>

            <div class="commerce-card admin-form-card admin-form-narrow">
                <form th:object="${brand}"
                      th:action="${isEdit} ? @{/admin/brand/update/{id}(id=${brand.brandId})} : @{/admin/brand/add}"
                      method="post">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <div class="form-group">
                        <label for="name">Brand Name</label>
                        <input id="name" type="text" th:field="*{name}" class="form-control"
                               placeholder="Example: ASUS" required minlength="2" maxlength="100">
                        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="form-group">
                        <label for="desc">Description</label>
                        <textarea id="desc" th:field="*{description}" class="form-control"
                                  rows="4" placeholder="Short brand description"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="website">Website</label>
                        <input id="website" type="url" th:field="*{website}" class="form-control"
                               placeholder="https://example.com">
                    </div>

                    <div class="form-group">
                        <label class="admin-checkbox-label">
                            <input type="checkbox" th:field="*{status}" id="status">
                            Active
                        </label>
                    </div>

                    <div class="admin-form-actions">
                        <a th:href="@{/admin/brand/list}" class="btn btn-app-outline">Cancel</a>
                        <button type="submit" class="btn btn-app-primary" th:text="${isEdit} ? 'Update' : 'Save'">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</th:block>
</body>
</html>

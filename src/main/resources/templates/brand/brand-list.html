<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Brand Management', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <section class="commerce-page admin-page">
        <div class="container">
            <div class="section-header">
                <div>
                    <p class="section-kicker">Admin Console</p>
                    <h1 class="commerce-title app-mb-0">Brand Management</h1>
                    <p class="section-subtitle app-mb-0">Manage brand visibility, edit brand information, or merge duplicate records.</p>
                </div>
                <div class="admin-header-actions">
                    <a th:href="@{/admin/brand/add}" class="btn btn-app-primary">Add Brand</a>
                    <a th:href="@{/admin/brand/merge}" class="btn btn-app-outline">Merge Brands</a>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${merged}" class="alert alert-success">
                <span th:text="'Merged ' + ${merged} + ' products successfully.'"></span>
            </div>

            <div class="commerce-card admin-table-card">
                <div class="table-responsive">
                    <table id="brandTable" class="table table-hover order-table admin-table" style="width:100%">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Brand Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th class="admin-actions-col">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="b : ${brand}">
                            <td th:text="${b.brandId}"></td>
                            <td th:text="${b.name}"></td>
                            <td th:text="${b.description}"></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${b.status} ? ' status-completed' : ' status-cancelled'"
                                      th:text="${b.status ? 'Active' : 'Inactive'}"></span>
                            </td>
                            <td>
                                <div class="admin-row-actions">
                                    <a th:href="@{'/admin/brand/update/' + ${b.brandId}}" class="btn btn-xs btn-app-primary">Edit</a>
                                    <form th:action="@{'/admin/brand/' + ${b.brandId} + '/status'}" method="post" class="admin-inline-form">
                                        <input type="hidden" name="status" th:value="${!b.status}">
                                        <button type="submit"
                                                th:text="${b.status ? 'Deactivate' : 'Activate'}"
                                                th:classappend="${b.status} ? ' btn-danger' : ' btn-success'"
                                                class="btn btn-xs"></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script th:inline="none">
        $(document).ready(function () {
            $('#brandTable').DataTable({
                pageLength: 10,
                lengthMenu: [5, 10, 25, 50],
                order: [[0, 'asc']],
                columnDefs: [
                    { orderable: false, targets: [4] }
                ]
            });
        });
    </script>
</th:block>
</body>
</html>

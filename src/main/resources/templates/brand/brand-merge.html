<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Merge Brands', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <section class="commerce-page admin-page">
        <div class="container">
            <div class="section-header">
                <h1 class="commerce-title app-mb-0">Merge Brands</h1>
                <a th:href="@{/admin/brand/list}" class="btn btn-app-outline">Back</a>
            </div>

            <div class="commerce-card admin-form-card admin-form-narrow">
                <form th:action="@{/admin/brand/merge}" method="post">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${merged}" class="alert alert-success"
                         th:text="'Merged ' + ${merged} + ' products successfully.'"></div>

                    <div class="form-group">
                        <label for="source">Source Brand</label>
                        <select id="source" name="sourceId" class="form-control" required>
                            <option value="">-- Select source brand --</option>
                            <option th:each="b : ${brand}"
                                    th:value="${b.brandId}"
                                    th:text="${b.name}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="target">Target Brand</label>
                        <select id="target" name="targetId" class="form-control" required>
                            <option value="">-- Select target brand --</option>
                            <option th:each="b : ${brand}"
                                    th:value="${b.brandId}"
                                    th:text="${b.name}"></option>
                        </select>
                    </div>

                    <div class="admin-form-actions">
                        <a th:href="@{/admin/brand/list}" class="btn btn-app-outline">Cancel</a>
                        <button type="submit" class="btn btn-app-primary">Merge</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</th:block>
</body>
</html>

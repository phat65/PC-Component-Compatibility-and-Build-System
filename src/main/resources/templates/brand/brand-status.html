<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Change Brand Status', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <section class="commerce-page admin-page">
        <div class="container">
            <div class="commerce-card admin-form-card admin-form-narrow">
                <h1 class="commerce-title">Confirm Status Change</h1>
                <p class="admin-confirm-text"
                   th:text="'Do you really want to ' + (${status} ? 'activate' : 'deactivate') + ' brand: ' + ${brand.name} + '?'"></p>

                <form th:action="@{|/admin/brand/${brand.brandId}/status|}" method="post">
                    <input type="hidden" name="status" th:value="${status}">
                    <div class="admin-form-actions">
                        <a th:href="@{/admin/brand/list}" class="btn btn-app-outline">Cancel</a>
                        <button type="submit" class="btn btn-app-primary">Confirm</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page page-build',
          ~{::main},
          ~{::page-styles},
          ${false}
      )}">
<head>
    <title>Select GPU COnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/build.css}">
    </th:block>
</head>
<body>
<main th:fragment="main">
<section class="build-page">
<div class="build-shell">
    <!-- Sidebar -->
    <div th:replace="~{layout/build-sidebar :: buildSidebar('gpu')}"></div>

    <!-- Main content -->
    <div class="main-content">
        <!-- Filter -->
        <div class="filter-bar">
            <input type="text" placeholder="Search..." id="searchBox"/>
            <button type="button" onclick="filterProducts()">Go!</button>
            <button type="button" id="openFilterPopup">Filter</button>
            <a href="#" class="clear-filter" th:href="@{/build/gpu}">Clear filter</a>
        </div>

        <!-- Filter & Sort Form Popup -->
        <div id="filterPopup" class="popup">
            <div class="popup-content">
                <form th:action="@{/build/gpu/filter}" method="post" id="filterForm" class="build-filter-panel">
                    <div class="gear-filter-heading">
                        <div>
                            <h4>Filter GPU</h4>
                            <span>Choose brand and sort order.</span>
                        </div>
                    </div>

                    <div class="gear-filter-section">
                        <span class="gear-filter-label">Brand</span>
                        <div class="build-filter-options">
                            <div th:each="brandObj : ${allBrands}">
                                <input type="checkbox" name="brands" th:value="${brandObj.name}"
                                       th:id="${'brand-' + brandObj.brandId}"
                                       th:checked="${selectedBrands != null && selectedBrands.contains(brandObj.name)}" />
                                <label th:for="${'brand-' + brandObj.brandId}" th:text="${brandObj.name}"></label>
                            </div>
                        </div>
                    </div>

                    <div class="gear-filter-section">
                        <span class="gear-filter-label">Sort</span>
                        <select name="sortBy" id="sortSelect">
                            <option value="">No Sort</option>
                            <option value="priceAsc" th:selected="${selectedSort == 'priceAsc'}">Price: Low to High</option>
                            <option value="priceDesc" th:selected="${selectedSort == 'priceDesc'}">Price: High to Low</option>
                            <option value="nameAsc" th:selected="${selectedSort == 'nameAsc'}">Name: A-Z</option>
                            <option value="nameDesc" th:selected="${selectedSort == 'nameDesc'}">Name: Z-A</option>
                        </select>
                    </div>

                    <div class="gear-filter-actions">
                        <a class="build-filter-reset" th:href="@{/build/gpu}">Reset</a>
                        <button type="button" id="closeFilterPopup">Close</button>
                        <button type="submit" id="applyFilter">Apply</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Product Grid -->
        <form th:action="@{/build/selectGpu}" method="post" id="gpuForm" data-require-selection="true">
            <input type="hidden" name="gpuId" id="selectedGpuId"
                   th:value="${buildItems.gpu?.product?.productId ?: ''}"/>
            <div class="product-grid">
                <div th:if="${#lists.isEmpty(gpus)}" class="build-grid-empty">
                    No compatible GPUs found.
                </div>
                <div th:each="gpu : ${gpus}"
                     class="product-card"
                     th:classappend="${buildItems.gpu?.product?.productId == gpu.productId} ? 'selected' : ''"
                     th:attr="data-id=${gpu.productId},data-price=${gpu.product.price}"
                     th:data-name="${gpu.product.productName}"
                     th:data-brand="${gpu.product.brand != null ? gpu.product.brand.name : ''}"
                     th:data-pcie="${gpu.pcieVersion}"
                     th:data-tdp="${gpu.tdp}"
                     th:data-vram="${gpu.vram}">
                    <!-- Product Image -->
                    <div class="product-image">
                        <img th:if="${gpu.product.images != null && !gpu.product.images.isEmpty()}"
                             th:src="@{${gpu.product.images[0].imageUrl}}"
                             th:alt="${gpu.product.productName}"/>
                        <div th:unless="${gpu.product.images != null && !gpu.product.images.isEmpty()}" class="build-no-image">No Image</div>
                    </div>
                    <h4 th:text="${gpu.product.productName}"></h4>
                    <p th:text="'PCIe: ' + ${gpu.pcieVersion}"></p>
                    <p th:text="'VRAM: ' + ${gpu.vram} + ' GB'"></p>
                    <strong th:text="${@money.format(gpu.product.price)}"></strong>
                </div>
            </div>
<div class="footer-bar">
                <span>Total Price: <strong id="priceTotal" th:text="${@money.format(buildItems.calculateTotalPrice())}"></strong></span>
                <button type="submit" class="next-btn">Choose</button>
            </div>
        </form>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel">
        <div class="detail-header">SELECT GPU</div>
        <div class="detail-body">
            <h3 id="detailName">Name Product</h3>
            <div class="detail-image"></div>
            <div class="detail-spec">
                <h4>SPECIFICATION</h4>
                <p id="detailSocket">PCIe: ...</p>
                <p id="detailRAM">VRAM: ...</p>
                <p id="detailTdp">TDP: ...</p>
            </div>
        </div>
    </div>
</div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script th:src="@{/js/BuildJs.js}"></script>
</main>
</body>
</html>

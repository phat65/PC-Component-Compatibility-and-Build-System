<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Select Case', null, ~{::content})}">
<body>
<th:block th:fragment="content">
<section class="build-page">
<div class="build-shell">
    <!-- Sidebar -->
    <div th:replace="~{layout/build-sidebar :: buildSidebar('case')}"></div>

    <!-- Main content -->
    <div class="main-content">
        <!-- Error message -->
        <div th:if="${error}" class="build-alert build-alert-danger"><strong>Error:</strong> <span th:text="${error}"></span></div>

        <!-- Filter -->
        <div class="filter-bar">
            <input type="text" placeholder="Search..." id="searchBox"/>
            <button type="button" onclick="filterProducts()">Go!</button>
            <button type="button" id="openFilterPopup">Filter</button>
            <a href="#" class="clear-filter" th:href="@{/build/case}">Clear filter</a>
        </div>

        <!-- Filter & Sort Form Popup -->
        <div id="filterPopup" class="popup">
            <div class="popup-content">
                <form th:action="@{/build/case/filter}" method="post" id="filterForm">
                    <h4>Filter By:</h4>
                    <div>
                        <div th:each="brandObj : ${allBrands}">
                            <input type="checkbox" name="brands" th:value="${brandObj.name}"
                                   th:id="${'brand-' + brandObj.brandId}"
                                   th:checked="${selectedBrands != null && selectedBrands.contains(brandObj.name)}" />
                            <label th:for="${'brand-' + brandObj.brandId}" th:text="${brandObj.name}"></label>
                        </div>
                    </div>

                    <h4 class="build-popup-subtitle">Sort By:</h4>
                    <select name="sortBy" id="sortSelect">
                        <option value="">-- No Sort --</option>
                        <option value="priceAsc" th:selected="${selectedSort == 'priceAsc'}">Price: Low to High</option>
                        <option value="priceDesc" th:selected="${selectedSort == 'priceDesc'}">Price: High to Low</option>
                        <option value="nameAsc" th:selected="${selectedSort == 'nameAsc'}">Name: A-Z</option>
                        <option value="nameDesc" th:selected="${selectedSort == 'nameDesc'}">Name: Z-A</option>
                    </select>

                    <button type="submit" id="applyFilter">Apply</button>
                    <button type="button" id="closeFilterPopup">Close</button>
                </form>
            </div>
        </div>

        <!-- Product Grid -->
        <form th:action="@{/build/selectCase}" method="post" id="caseForm">
            <input type="hidden" name="caseId" id="selectedCaseId"
                   th:value="${buildItems.pcCase?.product?.productId ?: ''}"/>
            <div class="product-grid">
                <div th:each="case : ${cases}"
                     class="product-card"
                     th:classappend="${buildItems.pcCase?.product?.productId == case.productId} ? 'selected' : ''"
                     th:attr="data-id=${case.productId}"
                     th:data-name="${case.product.productName}"
                     th:data-formfactor="${case.formFactor}"
                     th:data-gpumaxlength="${case.gpuMaxLength}"
                     th:data-cpumaxheight="${case.cpuMaxCoolerHeight}"
                     th:data-psuformfactor="${case.psuFormFactor}">
                    <!-- Product Image -->
                    <div class="product-image">
                        <img th:if="${case.product.images != null && !case.product.images.isEmpty()}"
                             th:src="@{${case.product.images[0].imageUrl}}"
                             th:alt="${case.product.productName}"/>
                        <div th:unless="${case.product.images != null && !case.product.images.isEmpty()}" class="build-no-image">No Image</div>
                    </div>
                    <h4 th:text="${case.product.productName}"></h4>
                    <p th:text="'Form Factor: ' + ${case.formFactor}"></p>
                    <p th:text="'GPU Max Length: ' + ${case.gpuMaxLength} + 'mm'"></p>
                    <p th:text="'PSU Support: ' + ${case.psuFormFactor}"></p>
                    <p th:text="'CPU Cooler Height: ' + ${case.cpuMaxCoolerHeight} + 'mm'"></p>
                    <strong th:text="'$' + ${case.product.price}"></strong>
                </div>
            </div>
<div class="footer-bar">
                <span>Total Price: <strong id="priceTotal" th:text="'$' + ${buildItems.formattedTotalPrice}"></strong></span>
                <button type="submit" class="next-btn">Choose</button>
            </div>
        </form>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel">
        <div class="detail-header">SELECT CASE</div>
        <div class="detail-body">
            <h3 id="detailName">Name Product</h3>
            <div class="detail-image"></div>
            <div class="detail-spec">
                <h4>SPECIFICATION</h4>
                <p id="detailFormFactor">Form Factor: ...</p>
                <p id="detailGpuLength">GPU Max Length: ...</p>
                <p id="detailCpuHeight">CPU Cooler Max Height: ...</p>
                <p id="detailPsuFormFactor">PSU Form Factor: ...</p>
            </div>
        </div>
    </div>
</div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script th:src="@{/js/BuildJs.js}"></script>
</th:block>
</body>
</html>

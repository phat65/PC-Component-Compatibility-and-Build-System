<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Select Cooling', null, ~{::content})}">
<body>
<th:block th:fragment="content">
<section class="build-page">
<div class="build-shell">
    <!-- Sidebar -->
    <div th:replace="~{layout/build-sidebar :: buildSidebar('cooling')}"></div>

    <!-- Main content -->
    <div class="main-content">
        <!-- Error message -->
        <div th:if="${error}" class="build-alert build-alert-danger"><strong>Error:</strong> <span th:text="${error}"></span></div>

        <!-- Filter -->
        <div class="filter-bar">
            <input type="text" placeholder="Search..." id="searchBox"/>
            <button type="button" onclick="filterProducts()">Go!</button>
            <button type="button" id="openFilterPopup">Filter</button>
            <a href="#" class="clear-filter" th:href="@{/build/cooling}">Clear filter</a>
        </div>

        <!-- Filter & Sort Form Popup -->
        <div id="filterPopup" class="popup">
            <div class="popup-content">
                <form th:action="@{/build/cooling/filter}" method="post" id="filterForm">
                    <h4>Filter By:</h4>
                    <div>
                        <div th:each="brandObj : ${allBrands}">
                            <input type="checkbox" name="brands" th:value="${brandObj.name}"
                                   th:id="${'brand-' + brandObj.brandId}"
                                   th:checked="${selectedBrands != null && selectedBrands.contains(brandObj.name)}" />
                            <label th:for="${'brand-' + brandObj.brandId}" th:text="${brandObj.name}"></label>
                        </div>
                    </div>

                    <h4 class="build-popup-subtitle">Sort By:</h4>
                    <select name="sortBy" id="sortSelect">
                        <option value="">-- No Sort --</option>
                        <option value="priceAsc" th:selected="${selectedSort == 'priceAsc'}">Price: Low to High</option>
                        <option value="priceDesc" th:selected="${selectedSort == 'priceDesc'}">Price: High to Low</option>
                        <option value="nameAsc" th:selected="${selectedSort == 'nameAsc'}">Name: A-Z</option>
                        <option value="nameDesc" th:selected="${selectedSort == 'nameDesc'}">Name: Z-A</option>
                    </select>

                    <button type="submit" id="applyFilter">Apply</button>
                    <button type="button" id="closeFilterPopup">Close</button>
                </form>
            </div>
        </div>

        <!-- Product Grid -->
        <form th:action="@{/build/selectCooling}" method="post" id="coolingForm">
            <input type="hidden" name="coolingId" id="selectedCoolingId"
                   th:value="${buildItems.cooling?.product?.productId ?: ''}"/>
            <div class="product-grid">
                <div th:if="${#lists.isEmpty(coolings)}" class="build-grid-empty">
                    No compatible cooling products found.
                </div>
                <div th:each="cl : ${coolings}"
                     class="product-card"
                     th:classappend="${buildItems.cooling?.product?.productId == cl.product.productId} ? 'selected' : ''"
                     th:attr="data-id=${cl.product.productId},data-price=${cl.product.price}"
                     th:data-name="${cl.product.productName}"
                     th:data-brand="${cl.product.brand != null ? cl.product.brand.name : ''}"
                     th:data-type="${cl.type}"
                     th:data-fansize="${cl.fanSize}"
                     th:data-tdp="${cl.tdp}">
                    <!-- Product Image -->
                    <div class="product-image">
                        <img th:if="${cl.product.images != null && !cl.product.images.isEmpty()}"
                             th:src="@{${cl.product.images[0].imageUrl}}"
                             th:alt="${cl.product.productName}"/>
                        <div th:unless="${cl.product.images != null && !cl.product.images.isEmpty()}" class="build-no-image">No Image</div>
                    </div>
                    <h4 th:text="${cl.product.productName}"></h4>
                    <p th:text="'Type: ' + ${cl.type}"></p>
                    <p th:text="'Fan Size: ' + ${cl.fanSize}"></p>
                    <strong th:text="'$' + ${cl.product.price}"></strong>
                </div>
            </div>
<div class="footer-bar">
                <span>Total Price: <strong id="priceTotal" th:text="'$' + ${buildItems.formattedTotalPrice}"></strong></span>
                <button type="submit" class="next-btn">Choose</button>
            </div>
        </form>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel">
        <div class="detail-header">SELECT COOLING</div>
        <div class="detail-body">
            <h3 id="detailName">Name Product</h3>
            <div class="detail-image"></div>
            <div class="detail-spec">
                <h4>SPECIFICATION</h4>
                <p id="detailType">Type: ...</p>
                <p id="detailFanSize">Fan Size: ...</p>
                <p id="detailTDP">TDP: ...</p>
            </div>
        </div>
    </div>
</div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script th:src="@{/js/BuildJs.js}"></script>
</th:block>
</body>
</html>

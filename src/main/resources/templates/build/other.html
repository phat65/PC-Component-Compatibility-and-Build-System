<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Select Other Components', null, ~{::content})}">
<body>
<th:block th:fragment="content">
<section class="build-page">
<div class="build-shell">
        <!-- Sidebar -->
        <div th:replace="~{layout/build-sidebar :: buildSidebar('other')}"></div>

        <!-- Main content -->
        <div class="main-content">
            <!-- Error message -->
            <div th:if="${error}" class="build-alert build-alert-danger"><strong>Error:</strong> <span th:text="${error}"></span></div>

            <!-- Success message -->
            <div th:if="${message}" class="build-alert build-alert-success"><strong>Success:</strong> <span th:text="${message}"></span></div>

            <!-- Filter -->
            <div class="filter-bar">
                <input type="text" placeholder="Search..." id="searchBox"/>
                <button type="button" onclick="filterProducts()">Go!</button>
                <button type="button" id="openFilterPopup">Filter</button>
            </div>

            <!-- Filter Popup -->
            <div id="filterPopup" class="popup">
                <div class="popup-content">
                    <div>
                        <h4>Filter By Category:</h4>
                        <div>
                            <input type="radio" name="categoryFilter" value="all" id="cat-all" checked onclick="filterByCategory('all')">
                            <label for="cat-all">All</label>
                        </div>
                        <div th:each="categoryOption : ${otherCategoryOptions}">
                            <input type="radio" name="categoryFilter"
                                   th:value="${categoryOption.slug}"
                                   th:id="${'cat-' + categoryOption.slug}"
                                   th:onclick="|filterByCategory('${categoryOption.slug}')|">
                            <label th:for="${'cat-' + categoryOption.slug}" th:text="${categoryOption.label}">Category</label>
                        </div>

                        <h4 class="build-popup-subtitle">Sort By:</h4>
                        <select id="sortSelect" onchange="sortProducts(this.value)">
                            <option value="">-- No Sort --</option>
                            <option value="priceAsc">Price: Low to High</option>
                            <option value="priceDesc">Price: High to Low</option>
                            <option value="nameAsc">Name: A-Z</option>
                            <option value="nameDesc">Name: Z-A</option>
                        </select>

                        <button type="button" id="closeFilterPopup">Close</button>
                    </div>
                </div>
            </div>

            <!-- Product Grid -->
            <form th:action="@{/build/selectOther}" method="post" id="otherForm" data-multi-select="true">
                <div id="selectedOtherIds" data-selected-items="otherIds">
                    <input th:each="selectedOther : ${buildItems.other}"
                           type="hidden"
                           name="otherIds"
                           th:value="${selectedOther.productId}"/>
                </div>
                <div class="product-grid">
                    <div th:if="${#lists.isEmpty(others)}" class="build-grid-empty">
                        No optional components found.
                    </div>
                    <div th:each="other : ${others}"
                         class="product-card"
                         th:classappend="${buildItems.hasOtherProduct(other.productId)} ? 'selected' : ''"
                         th:attr="data-id=${other.productId},data-price=${other.price}"
                         th:data-name="${other.productName}"
                         th:data-brand="${other.brand != null ? other.brand.name : ''}"
                         th:data-category="${otherCategoryMap[other.productId]}"
                         th:data-description="${other.description}">
                        <!-- Product Image -->
                        <div class="product-image">
                            <img th:if="${other.images != null && !other.images.isEmpty()}"
                                 th:src="@{${other.images[0].imageUrl}}"
                                 th:alt="${other.productName}"/>
                            <div th:unless="${other.images != null && !other.images.isEmpty()}" class="build-no-image">No Image</div>
                        </div>
                        <h4 th:text="${other.productName}"></h4>
                        <p th:text="${other.description}"></p>
                        <strong th:text="'$' + ${other.price}"></strong>
                    </div>
                </div>
<div class="footer-bar">
                    <span>Total Price: <strong id="priceTotal" th:text="'$' + ${buildItems.formattedTotalPrice}"></strong></span>
                    <button type="submit" class="next-btn">Choose</button>
                </div>
            </form>
        </div>

        <!-- Detail panel -->
        <div class="detail-panel">
            <div class="detail-header">SELECT OTHER COMPONENTS</div>
            <div class="detail-body">
                <h3 id="detailName">Name Product</h3>
                <div class="detail-image"></div>
                <div class="detail-spec">
                    <h4>DESCRIPTION</h4>
                    <p id="detailDescription">...</p>
                    <p id="detailPrice" class="build-detail-price">Price: $0.00</p>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script th:src="@{/js/BuildJs.js}"></script>
<script>
    // Filter by category for Other components
    function filterByCategory(category) {
        const cards = document.querySelectorAll('.product-card');
        cards.forEach(card => {
            const cardCategory = card.getAttribute('data-category');
            if (category === 'all' || cardCategory === category) {
                card.style.display = 'flex';
            } else {
                card.style.display = 'none';
            }
        });

        const emptyState = document.getElementById('buildSearchEmpty');
        if (emptyState) {
            emptyState.hidden = Array.from(cards).some(card => card.style.display !== 'none');
        }
    }

    // Sort products
    function sortProducts(sortType) {
        const grid = document.querySelector('.product-grid');
        const cards = Array.from(document.querySelectorAll('.product-card'));

        cards.sort((a, b) => {
            const priceA = parseFloat(a.getAttribute('data-price'));
            const priceB = parseFloat(b.getAttribute('data-price'));
            const nameA = a.getAttribute('data-name').toLowerCase();
            const nameB = b.getAttribute('data-name').toLowerCase();

            switch(sortType) {
                case 'priceAsc': return priceA - priceB;
                case 'priceDesc': return priceB - priceA;
                case 'nameAsc': return nameA.localeCompare(nameB);
                case 'nameDesc': return nameB.localeCompare(nameA);
                default: return 0;
            }
        });

        cards.forEach(card => grid.appendChild(card));
    }
</script>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page page-build',
          ~{::main},
          ~{::page-styles},
          ${false}
      )}">
<head>
    <title>Select Storage â€“ PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/build.css}">
    </th:block>
</head>
<body>
<main th:fragment="main">
<section class="build-page">
<div class="build-shell">
    <!-- Sidebar -->
    <div th:replace="~{layout/build-sidebar :: buildSidebar('storage')}"></div>

    <!-- Main content -->
    <div class="main-content">
        <!-- Error message -->
        <div th:if="${error}" class="build-alert build-alert-danger"><strong>Error:</strong> <span th:text="${error}"></span></div>

        <!-- Filter -->
        <div class="filter-bar">
            <input type="text" placeholder="Search..." id="searchBox"/>
            <button type="button" onclick="filterProducts()">Go!</button>
            <button type="button" id="openFilterPopup">Filter</button>
            <a href="#" class="clear-filter" th:href="@{/build/storage}">Clear filter</a>
        </div>

        <!-- Filter & Sort Form Popup -->
        <div id="filterPopup" class="popup">
            <div class="popup-content">
                <form th:action="@{/build/storage/filter}" method="post" id="filterForm">
                    <h4>Filter By:</h4>
                    <div>
                        <div th:each="brandObj : ${allBrands}">
                            <input type="checkbox" name="brands" th:value="${brandObj.name}"
                                   th:id="${'brand-' + brandObj.brandId}"
                                   th:checked="${selectedBrands != null && selectedBrands.contains(brandObj.name)}" />
                            <label th:for="${'brand-' + brandObj.brandId}" th:text="${brandObj.name}"></label>
                        </div>
                    </div>

                    <h4 class="build-popup-subtitle">Sort By:</h4>
                    <select name="sortBy" id="sortSelect">
                        <option value="">-- No Sort --</option>
                        <option value="priceAsc" th:selected="${selectedSort == 'priceAsc'}">Price: Low to High</option>
                        <option value="priceDesc" th:selected="${selectedSort == 'priceDesc'}">Price: High to Low</option>
                        <option value="nameAsc" th:selected="${selectedSort == 'nameAsc'}">Name: A-Z</option>
                        <option value="nameDesc" th:selected="${selectedSort == 'nameDesc'}">Name: Z-A</option>
                    </select>

                    <button type="submit" id="applyFilter">Apply</button>
                    <button type="button" id="closeFilterPopup">Close</button>
                </form>
            </div>
        </div>

        <!-- Product Grid -->
        <form th:action="@{/build/selectStorage}" method="post" id="storageForm">
            <input type="hidden" name="storageId" id="selectedStorageId"
                   th:value="${buildItems.storage?.product?.productId ?: ''}"/>
            <div class="product-grid">
                <div th:if="${#lists.isEmpty(storages)}" class="build-grid-empty">
                    No compatible storage products found.
                </div>
                <div th:each="storage : ${storages}"
                     class="product-card"
                     th:classappend="${buildItems.storage?.product?.productId == storage.product.productId} ? 'selected' : ''"
                     th:attr="data-id=${storage.product.productId},data-price=${storage.product.price}"
                     th:data-name="${storage.product.productName}"
                     th:data-brand="${storage.product.brand != null ? storage.product.brand.name : ''}"
                     th:data-type="${storage.type}"
                     th:data-capacity="${storage.capacity}">
                    <!-- Product Image -->
                    <div class="product-image">
                        <img th:if="${storage.product.images != null && !storage.product.images.isEmpty()}"
                             th:src="@{${storage.product.images[0].imageUrl}}"
                             th:alt="${storage.product.productName}"/>
                        <div th:unless="${storage.product.images != null && !storage.product.images.isEmpty()}" class="build-no-image">No Image</div>
                    </div>
                    <h4 th:text="${storage.product.productName}"></h4>
                    <p th:text="'Type: ' + ${storage.type}"></p>
                    <p th:text="'Capacity: ' + ${storage.capacity} + 'GB'"></p>
                    <strong th:text="'$' + ${storage.product.price}"></strong>
                </div>
            </div>
<div class="footer-bar">
                <span>Total Price: <strong id="priceTotal" th:text="'$' + ${buildItems.formattedTotalPrice}"></strong></span>
                <button type="submit" class="next-btn">Choose</button>
            </div>
        </form>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel">
        <div class="detail-header">SELECT STORAGE</div>
        <div class="detail-body">
            <h3 id="detailName">Name Product</h3>
            <div class="detail-image"></div>
            <div class="detail-spec">
                <h4>SPECIFICATION</h4>
                <p id="detailType">Type: ...</p>
                <p id="detailCapacity">Capacity: ...</p>
            </div>
        </div>
    </div>
</div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script th:src="@{/js/BuildJs.js}"></script>
</main>
</body>
</html>

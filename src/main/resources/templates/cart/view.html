<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page',
          ~{::main},
          ~{::page-styles},
          ${false}
      )}">
<head>
    <title>Shopping Cart – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/cart.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="cart-page page-section">
    <div class="page-container">

        <h1>Your Shopping Cart</h1>

        <div id="cart-messages" class="cart-messages">
            <div th:if="${success}" class="alert alert--success" role="alert" id="success-alert">
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert--error" role="alert" id="error-alert">
                <span th:text="${error}"></span>
            </div>
        </div>

        <div th:if="${isEmpty}" class="empty-cart">
            <h3>Your cart is empty!</h3>
            <p>Looks like you haven't added anything to your cart yet.</p>
            <a th:href="@{/products}" class="btn-primary">Continue Shopping</a>
        </div>

        <div th:unless="${isEmpty}" class="cart-layout">
            <div class="cart-main">
                <div class="cart-header">
                    <div class="select-all-container">
                        <input type="checkbox" id="select-all-checkbox" class="cart-checkbox">
                        <label for="select-all-checkbox">Select All (<span id="total-items-count"
                               th:text="${#lists.size(cartItems)}">0</span>)</label>
                    </div>
                    <div class="cart-column-headers">
                        <span>Price</span>
                        <span>Quantity</span>
                        <span>Subtotal</span>
                    </div>
                    <form th:action="@{/cart/clear}" method="post" id="clear-cart-form">
                        <button type="button" class="clear-cart-icon-btn" title="Clear Entire Cart">🗑️</button>
                    </form>
                </div>

                <div class="cart-items-list cart-container">
                    <div class="cart-item" th:each="item : ${cartItems}"
                         th:attr="data-cart-item-id=${item.cartItemId}, data-price=${item.price}, data-inventory=${item.inventoryQuantity}">
                        <div class="item-selection">
                            <input type="checkbox" class="cart-item-checkbox cart-checkbox"
                                   th:data-cart-item-id="${item.cartItemId}"
                                   th:checked="${item.selected}">
                        </div>
                        <div class="item-image">
                            <a th:href="@{'/products/' + ${item.productId}}">
                                <img th:src="${item.imageUrl}" alt="Product Image" class="product-image">
                            </a>
                        </div>
                        <div class="item-details">
                            <a th:href="@{'/products/' + ${item.productId}}" class="product-link product-name"
                               th:text="${item.productName}">Product Name</a>
                        </div>
                        <div class="item-price"
                             th:text="${@money.format(item.price)}">Price</div>
                        <div class="item-quantity">
                            <button type="button" class="quantity-change-btn decrease-qty-btn qty-btn"
                                    th:disabled="${item.quantity <= 1}">-</button>
                            <input type="text" class="quantity-display" th:value="${item.quantity}" readonly>
                            <button type="button" class="quantity-change-btn increase-qty-btn qty-btn"
                                    th:disabled="${item.quantity >= item.inventoryQuantity}">+</button>
                        </div>
                        <div class="item-subtotal"
                             th:text="${@money.format(item.subtotal)}">Subtotal</div>
                        <div class="item-remove">
                            <button type="button" class="remove-item-btn" title="Remove item">🗑️</button>
                        </div>
                    </div>
                </div>
            </div>

            <aside class="cart-sidebar">
                <div class="cart-summary">
                    <h3>Summary</h3>
                    <div class="summary-line">
                        <span>Selected Items (<span id="selected-items-count">0</span>):</span>
                        <span id="selected-items-total">0 $</span>
                    </div>
                    <hr>
                    <div class="summary-line grand-total">
                        <span>Grand Total:</span>
                        <span id="grand-total-value"
                              th:data-raw-total="${grandTotal}"
                              th:text="${@money.format(grandTotal)}">0 VND</span>
                    </div>
                    <a th:href="@{/orders/checkout}" id="checkout-link"
                       class="checkout-btn btn-primary"
                       th:classappend="${grandTotal == 0} ? ' disabled' : ''">
                        Proceed to Checkout
                    </a>
                </div>
            </aside>
        </div>

    </div>
    <script th:src="@{/js/cart.js}"></script>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Shopping Cart', null, ~{::content})}">
<body>
<th:block th:fragment="content">
<section class="commerce-page">
    <div class="container cart-container">
        <h1 class="commerce-title">Shopping Cart</h1>

        <div id="cart-messages">
            <div th:if="${success}" class="alert alert-success" role="alert">
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
        </div>

        <div th:if="${isEmpty}" class="empty-state-panel">
            <h3>Your cart is empty</h3>
            <p>Looks like you have not added anything to your cart yet.</p>
            <a th:href="@{/products}" class="btn btn-app-primary">Continue Shopping</a>
        </div>

        <div th:unless="${isEmpty}" class="row">
            <div class="col-md-8">
                <div class="commerce-card">
                    <div class="cart-toolbar">
                        <label class="app-flex app-align-center app-gap-1 app-mb-0" for="select-all-checkbox">
                            <input type="checkbox" id="select-all-checkbox" class="cart-checkbox">
                            <span>Select All (<span id="total-items-count" th:text="${#lists.size(cartItems)}">0</span>)</span>
                        </label>

                        <form th:action="@{/cart/clear}" method="post" id="clear-cart-form">
                            <button type="button" class="clear-cart-icon-btn icon-button" title="Clear entire cart">
                                <i class="fa fa-trash"></i>
                            </button>
                        </form>
                    </div>

                    <div class="cart-items-list">
                        <div class="cart-item" th:each="item : ${cartItems}"
                             th:attr="data-cart-item-id=${item.cartItemId}, data-price=${item.price}, data-inventory=${item.inventoryQuantity}">

                            <div class="item-selection">
                                <input type="checkbox" class="cart-item-checkbox cart-checkbox"
                                       th:data-cart-item-id="${item.cartItemId}"
                                       th:checked="${item.selected}">
                            </div>

                            <div class="item-image">
                                <a th:href="@{/products/{id}(id=${item.productId})}">
                                    <img th:src="${item.imageUrl != null ? item.imageUrl : '/images/no-image.svg'}"
                                         onerror="this.onerror=null;this.src='/images/no-image.svg';"
                                         alt="Product image">
                                </a>
                            </div>

                            <div class="item-details">
                                <a th:href="@{/products/{id}(id=${item.productId})}"
                                   class="product-name"
                                   th:text="${item.productName}">Product Name</a>
                            </div>

                            <div class="item-price"
                                 th:text="'$' + ${#numbers.formatInteger(item.price, 1, 'COMMA')}">Price</div>

                            <div class="item-quantity">
                                <button type="button" class="quantity-change-btn decrease-qty-btn btn btn-default btn-sm"
                                        th:disabled="${item.quantity <= 1}">-
                                </button>
                                <input type="text" class="quantity-display form-control input-sm"
                                       th:value="${item.quantity}" readonly>
                                <button type="button" class="quantity-change-btn increase-qty-btn btn btn-default btn-sm"
                                        th:disabled="${item.quantity >= item.inventoryQuantity}">+
                                </button>
                            </div>

                            <div class="item-subtotal"
                                 th:text="'$' + ${#numbers.formatInteger(item.subtotal, 1, 'COMMA')}">Subtotal</div>

                            <div class="item-remove">
                                <button type="button" class="remove-item-btn icon-button" title="Remove item">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <aside class="commerce-card cart-summary">
                    <h3>Summary</h3>
                    <div class="summary-line">
                        <span>Selected Items (<span id="selected-items-count">0</span>)</span>
                        <span id="selected-items-total" class="summary-value">$0</span>
                    </div>
                    <div class="summary-line grand-total">
                        <span>Grand Total</span>
                        <span id="grand-total-value"
                              class="summary-value"
                              th:data-raw-total="${grandTotal}"
                              th:text="'$' + ${#numbers.formatInteger(grandTotal, 1, 'COMMA')}">$0</span>
                    </div>
                    <a th:href="@{/orders/checkout}" id="checkout-link"
                       class="btn btn-app-primary btn-block app-mt-4"
                       th:classappend="${grandTotal == 0} ? ' disabled' : ''">
                        Proceed to Checkout
                    </a>
                </aside>
            </div>
        </div>
    </div>
</section>

<script th:src="@{/js/cart.js}"></script>
</th:block>
</body>
</html>

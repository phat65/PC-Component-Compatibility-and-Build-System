<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page page-chat',
          ~{::main},
          ~{::page-styles},
          ${false}
      )}">
<head>
    <title>Chat AI – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/chat.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="chat-main">
    <div class="chat-container">

        <div class="chat-page-header">
            <p class="chat-page-header__eyebrow">AI Assistant</p>
            <h1 class="chat-page-header__title">Chat AI</h1>
            <p class="chat-page-header__room">Room #<span th:text="${room.id}"></span></p>
        </div>

        <div class="chat-window">

            <div class="chat-messages" id="chatBox">
                <th:block th:each="msg : ${room.messages}">
                    <div th:classappend="${msg.sender == 'USER'} ? 'chat-msg chat-msg--user' : 'chat-msg chat-msg--ai'">
                        <span class="chat-msg__sender" th:text="${msg.sender}"></span>
                        <div class="chat-msg__bubble" th:text="${msg.message}"></div>
                    </div>
                </th:block>
            </div>

            <form th:action="@{/chat/send}" method="post" class="chat-input-bar">
                <input type="hidden" name="roomId" th:value="${room.id}"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="text" name="message" placeholder="Ask me anything about PC builds…" required
                       autocomplete="off">
                <button type="submit" class="chat-send-btn">Send</button>
            </form>

        </div>

    </div>

    <script>
        // Auto-scroll to bottom on load
        (function () {
            var box = document.getElementById('chatBox');
            if (box) box.scrollTop = box.scrollHeight;
        })();
    </script>
</main>
</body>
</html>

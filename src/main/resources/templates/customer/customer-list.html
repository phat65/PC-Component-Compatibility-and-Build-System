<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Customer List', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">

    <section class="commerce-page admin-page">
        <div class="container">
            <div class="section-header">
                <div>
                    <p class="section-kicker">Admin Console</p>
                    <h1 class="commerce-title app-mb-0">Customer Management</h1>
                    <p class="section-subtitle app-mb-0">View customer profiles, account status, and contact records in one place.</p>
                </div>
                <a th:href="@{/customer/add}" class="btn btn-app-primary" sec:authorize="hasRole('ADMIN')">Add Customer</a>
            </div>

            <div class="commerce-card admin-table-card">
                <div class="admin-filter-bar">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter" class="form-control">
                        <option value="active" th:selected="${statusFilter == 'active'}">Active</option>
                        <option value="inactive" th:selected="${statusFilter == 'inactive'}">Inactive</option>
                        <option value="all" th:selected="${statusFilter == 'all'}">All</option>
                    </select>
                </div>

                <div class="table-responsive">
                    <table id="customerTable" class="table table-hover order-table admin-table" style="width:100%">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Status</th>
                            <th class="admin-actions-col">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${customerList}">
                            <td th:text="${c.accountId}"></td>
                            <td th:text="${c.fullName}"></td>
                            <td th:text="${c.email}"></td>
                            <td th:text="${c.phoneNumber}"></td>
                            <td th:text="${c.defaultAddress}"></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${c.enabled} ? ' status-completed' : ' status-cancelled'"
                                      th:text="${c.enabled} ? 'Active' : 'Inactive'">Active</span>
                            </td>
                            <td>
                                <div class="admin-row-actions">
                                    <a th:href="@{'/customer/view/' + ${c.accountId}}" class="btn btn-xs btn-app-outline">View</a>
                                    <a th:href="@{'/customer/edit/' + ${c.accountId}}" class="btn btn-xs btn-app-primary">Edit</a>
                                    <a th:href="@{'/customer/delete/' + ${c.accountId}}"
                                       class="btn btn-xs"
                                       th:classappend="${c.enabled} ? ' btn-danger' : ' btn-success'"
                                       th:text="${c.enabled} ? 'Deactivate' : 'Activate'"></a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <script th:inline="none">
        $(function () {
            $('#statusFilter').on('change', function () {
                window.location.href = '/customer/list?statusFilter=' + $(this).val();
            });

            $('#customerTable').DataTable({
                responsive: false,
                pageLength: 5,
                lengthMenu: [5, 10, 25, 50, 100],
                order: [[0, 'asc']],
                columnDefs: [
                    { targets: -1, orderable: false, searchable: false },
                    { targets: 4, className: 'all' }
                ]
            });
        });
    </script>
</th:block>
</body>
</html>

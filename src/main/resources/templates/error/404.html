<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: page('Page Not Found - PCOnlineShop', 'Page not found', ~{::section})}">
<body>
<section class="empty-state">
    <div class="empty-state-code">404</div>
    <p th:text="${error != null ? error : 'The page or category you are looking for does not exist.'}">
        The page or category you are looking for does not exist.
    </p>
    <div class="page-actions">
        <a class="app-btn app-btn-primary" th:href="@{/products}">Browse products</a>
        <a class="app-btn app-btn-secondary" th:href="@{/home}">Go home</a>
    </div>
</section>
</body>
</html>

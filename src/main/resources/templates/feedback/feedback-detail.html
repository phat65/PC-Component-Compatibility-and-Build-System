<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Feedback Detail', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/pages/management-tools.css}">

    <section class="commerce-page management-tool-page">
        <div class="management-tool-container">
            <a class="btn-back" th:href="@{|/staff/feedback?${back}|}">&larr; Back</a>

            <div class="management-page-header" th:object="${fb}">
                <div>
                    <p class="management-page-header__eyebrow">Staff Console</p>
                    <h1 class="management-page-header__title">Feedback Detail</h1>
                    <p class="management-page-header__subtitle">Review the original comment, approve public visibility, and send or update a reply.</p>
                </div>
            </div>

            <div class="management-card management-card-padded" th:object="${fb}">
                <h3 class="management-card__title">Customer Feedback</h3>

                <div class="feedback-header">
                    <div class="user-avatar">
                        <span th:text="${fb.account.fullName.substring(0,1).toUpperCase()}"></span>
                    </div>
                    <div>
                        <div th:text="${fb.account.fullName}">User</div>
                        <small th:text="${#temporals.format(fb.createdAt,'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                </div>

                <div class="feedback-comment" th:text="${fb.comment}"></div>

                <div class="feedback-stars">
                    <span th:each="i : ${#numbers.sequence(1,5)}"
                          th:text="${i <= fb.rating ? '&#9733;' : '&#9734;'}"
                          class="star"></span>
                </div>

                <div class="feedback-status-row">
                    <span class="management-label">Status</span>
                    <span class="management-status"
                          th:classappend="${fb.commentStatus == 'Allow' ? ' status-feedback-allowed' : (fb.commentStatus == 'Denied' ? ' status-feedback-denied' : ' status-feedback-pending')}"
                          th:text="${fb.commentStatus == 'Allow' ? 'Approved' : (fb.commentStatus == 'Denied' ? 'Denied' : 'Pending')}"></span>
                </div>

                <form th:if="${fb.commentStatus != 'Allow'}"
                      th:action="@{|/staff/feedback/${fb.feedbackId}/approve|}"
                      method="post"
                      class="feedback-approve-form"
                      onsubmit="return confirm('Approve this feedback and show it on the product page?');">
                    <button type="submit" class="management-btn management-btn-primary">Approve Feedback</button>
                </form>
            </div>

            <div class="management-card management-card-padded">
                <h3 class="management-card__title">Reply</h3>

                <form method="post"
                      th:action="@{|/staff/feedback/${fb.feedbackId}/reply|}"
                      onsubmit="return confirmEdit();">

                    <input type="hidden" name="back" th:value="${back}"/>

                    <label for="reply">Staff Reply</label>
                    <textarea id="reply"
                              class="feedback-reply-box"
                              name="reply"
                              maxlength="500"
                              required
                              placeholder="Type reply here..."
                              th:text="${fb.reply}"></textarea>

                    <div class="action-buttons">
                        <a class="btn-back" th:href="@{|/staff/feedback?${back}|}">Back</a>
                        <button class="btn-send" type="submit">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>
        function confirmEdit() {
            return confirm('Confirm sending or updating this reply?');
        }
    </script>
</th:block>
</body>
</html>

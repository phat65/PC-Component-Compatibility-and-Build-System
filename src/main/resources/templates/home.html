<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page',
          ~{::main},
          ~{::page-styles},
          ${true}
      )}">
<head>
    <title>PCOnlineShop – Home</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/home.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="home-main">

    <section class="hero">
        <div class="hero__bg" aria-hidden="true"></div>

        <div class="hero__neon" aria-hidden="true">
            <div class="neon-orb neon-orb--1"></div>
            <div class="neon-orb neon-orb--2"></div>
            <div class="neon-orb neon-orb--3"></div>
        </div>

        <div class="hero__scene" aria-hidden="true">
            <div class="hero__rig" id="heroRig">
                <div class="hero__ring hero__ring--outer"></div>
                <div class="hero__ring hero__ring--mid"></div>
                <div class="hero__ring hero__ring--inner"></div>
                <div class="hero__core"></div>
            </div>
        </div>

        <div class="hero__content">
            <p class="hero__eyebrow hero__neon-text">Premium PC Components</p>
            <h1 class="hero__title hero__neon-text hero__neon-text--title">Build Your Dream PC</h1>
            <p class="hero__subtitle">High-performance hardware · Guaranteed compatibility</p>
            <a th:href="@{/products}" class="btn-primary hero__cta">Shop Now</a>
        </div>
        <a href="#categories" class="hero__scroll hero__scroll--neon" aria-label="Scroll to categories">↓</a>
    </section>

    <section id="categories" class="categories-section">
        <div class="page-container">
            <div class="section-header section-header--neon">
                <h2 class="section-header__title">Shop by Category</h2>
                <div class="section-header__neon-line" aria-hidden="true"></div>
            </div>
            <div class="category-grid">
                <a th:each="c : ${categories}"
                   th:href="@{/products(category=${c.categoryId})}"
                   th:attr="data-cat=${c.categoryName}"
                   class="category-card"
                   th:classappend="${selectedCategory == c.categoryId} ? ' is-active' : ''">
                    <div class="category-card__visual" aria-hidden="true"></div>
                    <div class="category-card__footer">
                        <span class="category-card__label">
                            <span class="category-card__prefix">//</span>
                            <span th:text="${c.categoryName == 'Other' ? 'Gear' : c.categoryName}">Category</span>
                        </span>
                        <span class="category-card__arrow" aria-hidden="true">→</span>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <section class="brands-section">
        <div class="page-container">
            <div class="section-header section-header--neon">
                <h2 class="section-header__title">Shop by Brand</h2>
                <div class="section-header__neon-line" aria-hidden="true"></div>
            </div>

            <div class="brands-head" th:if="${brands != null and !brands.isEmpty()}">
                <a th:if="${selectedBrand != null}"
                   th:href="@{/home}"
                   class="brands-head__reset">Clear filter</a>
            </div>
        </div>

        <div class="brands-loop" th:if="${brands != null and !brands.isEmpty()}">
            <div class="brands-loop__shade brands-loop__shade--left" aria-hidden="true"></div>
            <div class="brands-loop__shade brands-loop__shade--right" aria-hidden="true"></div>

            <div class="brands-loop__row brands-loop__row--left">
                <div class="brands-loop__track">
                    <div class="brands-loop__group" role="list">
                        <th:block th:each="b : ${brands}">
                            <th:block th:replace="~{layout/fragments/brand-chip :: brand-chip(brand=${b}, isActive=${selectedBrand == b.brandId}, isClone=false)}" />
                        </th:block>
                    </div>
                    <div class="brands-loop__group" aria-hidden="true">
                        <th:block th:each="b : ${brands}">
                            <th:block th:replace="~{layout/fragments/brand-chip :: brand-chip(brand=${b}, isActive=false, isClone=true)}" />
                        </th:block>
                    </div>
                </div>
            </div>

            <div class="brands-loop__row brands-loop__row--right">
                <div class="brands-loop__track">
                    <div class="brands-loop__group" role="list" aria-label="Brands row 2">
                        <th:block th:each="b : ${brands}">
                            <th:block th:replace="~{layout/fragments/brand-chip :: brand-chip(brand=${b}, isActive=${selectedBrand == b.brandId}, isClone=false)}" />
                        </th:block>
                    </div>
                    <div class="brands-loop__group" aria-hidden="true">
                        <th:block th:each="b : ${brands}">
                            <th:block th:replace="~{layout/fragments/brand-chip :: brand-chip(brand=${b}, isActive=false, isClone=true)}" />
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="products-section">
        <div class="page-container">
            <div class="section-header section-header--neon">
                <h2 class="section-header__title"
                    th:text="${selectedCategory != null or selectedBrand != null} ? 'Products' : 'Featured Products'">
                    Featured Products
                </h2>
                <div class="section-header__neon-line" aria-hidden="true"></div>
            </div>

            <div th:if="${#lists.isEmpty(featuredProducts)}" class="products-empty">
                No products found for this filter.
            </div>

            <div th:unless="${#lists.isEmpty(featuredProducts)}" class="product-grid">
                <th:block th:each="p : ${featuredProducts}">
                    <th:block th:replace="~{layout/fragments/product-card :: product-card(item=${p})}" />
                </th:block>
            </div>
        </div>
    </section>

    <script th:src="@{/js/pages/home.js}" defer></script>
</main>
</body>
</html>

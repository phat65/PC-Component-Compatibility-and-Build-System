<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base-minimal :: minimal(
          ~{::title},
          'landing-page',
          ~{::main},
          ~{::page-styles}
      )}">
<head>
    <title>PCOnlineShop – Landing</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/landing.css}">
    </th:block>
</head>
<body>
<main th:fragment="main">
    <section class="landing-hero">
        <h1 class="landing-hero__title">Build Your Dream PC</h1>
        <p class="landing-hero__subtitle">
            Premium components. Guaranteed compatibility. Unbeatable prices.
        </p>
        <a th:href="@{/home}" class="btn-primary">Shop Now →</a>
    </section>
    <footer class="landing-footer">
        © 2025 PCOnlineShop. All rights reserved.
    </footer>
</main>
</body>
</html>

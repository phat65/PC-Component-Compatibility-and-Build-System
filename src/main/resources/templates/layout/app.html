<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(pageTitle, pageHeading, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle : 'PCOnlineShop'}">PCOnlineShop</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            background: #f8fafc;
            color: #1f2937;
        }

        .app-main {
            min-height: calc(100vh - 260px);
            padding: 32px 16px 48px;
        }

        .app-main > [th\:fragment="content"],
        .app-main > th\:block {
            display: contents;
        }

        .page-body {
            min-height: inherit;
        }

        .app-main:has(.page-body),
        .app-main:has(> .container),
        .app-main:has(.checkout-container),
        .app-main:has(.build-page),
        .app-main:has(.dashboard-page),
        .app-main:has(.auth-page) {
            padding: 0;
        }

        .app-heading {
            max-width: 1120px;
            margin: 0 auto 24px;
        }

        .app-heading h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.2;
            color: #111827;
        }

        .empty-state {
            max-width: 560px;
            margin: 64px auto;
            text-align: center;
        }

        .empty-state-code {
            margin-bottom: 16px;
            color: #2563eb;
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
        }

        .empty-state p {
            margin: 0 0 28px;
            color: #64748b;
            line-height: 1.6;
        }

        .page-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .app-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
        }

        .app-btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .app-btn-secondary {
            background: #e5e7eb;
            color: #1f2937;
        }
    </style>
</head>
<body>
<div sec:authorize="!isAuthenticated()" th:replace="~{layout/header-default :: header-default}"></div>
<div sec:authorize="hasRole('ADMIN')" th:replace="~{layout/header-admin :: header-admin}"></div>
<div sec:authorize="hasRole('STAFF')" th:replace="~{layout/header-staff :: header-staff}"></div>
<div sec:authorize="hasRole('CUSTOMER')" th:replace="~{layout/header-customer :: header-customer}"></div>

<main class="app-main page-body">
    <section class="app-heading" th:if="${pageHeading != null and !#strings.isEmpty(pageHeading)}">
        <h1 th:text="${pageHeading}">Page heading</h1>
    </section>
    <th:block th:replace="${content}"></th:block>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>

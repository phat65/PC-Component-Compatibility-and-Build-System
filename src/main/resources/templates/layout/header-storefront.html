<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="header-storefront">
    <link rel="stylesheet" th:href="@{/css/base/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components/header.css}">
    <header class="site-header">
    <div class="site-header__inner">
        <a th:href="@{/home}" class="site-header__logo" aria-label="PCOnlineShop home">
            <img th:src="@{/assets/image/logo.jpg}" alt="" class="site-header__logo-img" width="40" height="40">
            <span class="site-header__logo-text">PCOnlineShop</span>
        </a>

        <nav class="site-header__nav" aria-label="Main navigation">
            <a th:href="@{/products}" class="site-header__nav-link">Shop</a>
            <a th:href="@{/build/start}" class="site-header__nav-link">Build PC</a>
            <div class="site-header__categories" th:if="${gearParentCategory != null}">
                <button type="button"
                        class="site-header__nav-link site-header__categories-toggle"
                        id="gearToggle"
                        aria-expanded="false"
                        aria-haspopup="true"
                        aria-controls="gearMenu">
                    Gear
                    <svg class="site-header__chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                        <path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <div id="gearMenu" class="site-header__dropdown" role="menu" aria-hidden="true">
                    <a th:href="@{/products(category=${gearParentCategory.categoryId})}"
                       class="site-header__dropdown-item"
                       role="menuitem">All Gear</a>
                    <a th:each="gearCategory : ${gearCategories}"
                       th:href="@{/products(category=${gearCategory.categoryId})}"
                       class="site-header__dropdown-item"
                       role="menuitem"
                       th:text="${gearCategory.categoryName}">Gear</a>
                </div>
            </div>
            <a th:href="@{/blog}" class="site-header__nav-link">Blog</a>

            <div class="site-header__categories" th:if="${categories != null and !categories.isEmpty()}">
                <button type="button"
                        class="site-header__nav-link site-header__categories-toggle"
                        id="categoriesToggle"
                        aria-expanded="false"
                        aria-haspopup="true"
                        aria-controls="categoriesMenu">
                    Categories
                    <svg class="site-header__chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                        <path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <div id="categoriesMenu" class="site-header__dropdown" role="menu" aria-hidden="true">
                    <a th:each="c : ${categories}"
                       th:href="@{/products(category=${c.categoryId})}"
                       class="site-header__dropdown-item"
                       role="menuitem"
                       th:text="${c.categoryName == 'Other' ? 'Gear' : c.categoryName}">Category</a>
                </div>
            </div>
        </nav>

        <form class="site-header__search" th:action="@{/products}" method="get" role="search">
            <label for="header-search" class="visually-hidden">Search products</label>
            <input id="header-search"
                   name="keyword"
                   type="search"
                   placeholder="Search components..."
                   autocomplete="off">
            <button type="submit" class="site-header__search-btn" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </form>

        <div class="site-header__actions">
            <a th:href="@{/build/start}" class="site-header__cta" title="Build PC">
                <svg class="site-header__cta-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 2l2 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6l2-6z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                </svg>
                <span class="site-header__cta-label">Build PC</span>
            </a>

            <a th:href="@{/cart}" class="site-header__icon-btn" aria-label="Cart" title="Cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M6 6h15l-1.5 9h-12L6 6z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                    <circle cx="9" cy="20" r="1.25" fill="currentColor"/>
                    <circle cx="18" cy="20" r="1.25" fill="currentColor"/>
                    <path d="M6 6L5 3H2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                </svg>
                <span class="cart-count" th:text="${cartItemCount ?: 0}">0</span>
            </a>

            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}" class="site-header__login">Login</a>
            </th:block>

            <th:block sec:authorize="hasRole('CUSTOMER')">
                <div class="site-header__account">
                    <button type="button"
                            id="profileToggle"
                            class="site-header__icon-btn site-header__account-toggle"
                            aria-expanded="false"
                            aria-haspopup="true"
                            aria-controls="profileDropdown"
                            title="My account">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.75"/>
                            <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <div id="profileDropdown" class="site-header__dropdown site-header__dropdown--account" role="menu" aria-hidden="true">
                        <a th:href="@{/orders/list}" class="site-header__dropdown-item" role="menuitem">My Orders</a>
                        <a th:href="@{/profile}" class="site-header__dropdown-item" role="menuitem">My Profile</a>
                        <form th:action="@{/auth/logout}" method="post" class="site-header__logout-form">
                            <button type="submit" class="site-header__dropdown-item site-header__dropdown-item--btn" role="menuitem">Logout</button>
                        </form>
                    </div>
                </div>
            </th:block>
        </div>

        <button type="button"
                class="site-header__menu-toggle"
                id="mobileMenuToggle"
                aria-expanded="false"
                aria-controls="mobileMenu"
                aria-label="Open menu">
            <svg class="site-header__menu-icon site-header__menu-icon--open" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg class="site-header__menu-icon site-header__menu-icon--close" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <div id="mobileMenu" class="site-header__mobile" aria-hidden="true">
        <nav class="site-header__mobile-nav" aria-label="Mobile navigation">
            <a th:href="@{/products}" class="site-header__mobile-link">Shop</a>
            <a th:href="@{/build/start}" class="site-header__mobile-link">Build PC</a>
            <a th:if="${gearParentCategory != null}"
               th:href="@{/products(category=${gearParentCategory.categoryId})}"
               class="site-header__mobile-link">Gear</a>
            <a th:each="gearCategory : ${gearCategories}"
               th:href="@{/products(category=${gearCategory.categoryId})}"
               th:text="${gearCategory.categoryName}"
               class="site-header__mobile-link">Gear</a>
            <a th:href="@{/blog}" class="site-header__mobile-link">Blog</a>
            <a th:href="@{/cart}" class="site-header__mobile-link">Cart</a>
            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}" class="site-header__mobile-link site-header__mobile-link--accent">Login</a>
            </th:block>
            <th:block sec:authorize="hasRole('CUSTOMER')">
                <a th:href="@{/orders/list}" class="site-header__mobile-link">My Orders</a>
                <a th:href="@{/profile}" class="site-header__mobile-link">My Profile</a>
            </th:block>
        </nav>
        <form class="site-header__mobile-search" th:action="@{/products}" method="get" role="search">
            <input name="keyword" type="search" placeholder="Search components..." autocomplete="off">
            <button type="submit" class="btn-primary">Search</button>
        </form>
    </div>
    </header>
    <script th:src="@{/js/pages/header.js}" defer></script>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Orders', null, ~{::content})}">
<body>
<th:block th:fragment="content">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" th:if="${isStaffOrAdmin}">

<section class="commerce-page">
    <div class="container">
        <h1 class="commerce-title" th:text="${pageTitle ?: 'Orders'}">Orders</h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

        <div class="commerce-card">
            <div class="table-responsive">
                <table id="orderTable" class="table table-hover order-table" th:if="${isStaffOrAdmin}">
                    <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Created Date</th>
                        <th>Final Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${adminOrderList}">
                        <td th:text="${order.orderId}"></td>
                        <td th:text="${order.account?.fullName}"></td>
                        <td th:data-order="${#dates.format(order.createdDate, 'yyyyMMdd')}"
                            th:text="${#dates.format(order.createdDate, 'dd/MM/yyyy')}"></td>
                        <td th:data-order="${order.finalAmount}"
                            th:text="'$' + ${#numbers.formatInteger(order.finalAmount, 1, 'COMMA')}"></td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="${
                                    (order.status == 'Pending Payment' or order.status == 'Pending') ? ' status-pending' :
                                    order.status == 'Processing' ? ' status-processing' :
                                    order.status == 'Ready to Ship' ? ' status-ready' :
                                    order.status == 'Delivering' ? ' status-delivering' :
                                    order.status == 'Completed' ? ' status-completed' :
                                    order.status == 'Cancelled' ? ' status-cancelled' : ''
                                  }"
                                  th:text="${order.status ?: 'N/A'}">Status</span>
                            <span th:if="${order.status == 'Cancelled' and order.paymentStatus == 'REFUND_PENDING'}"
                                  class="status-refund-pending">(Refund Pending)</span>
                        </td>
                        <td>
                            <a th:href="@{/orders/detail/{id}(id=${order.orderId})}" class="btn btn-app-outline btn-sm">View</a>
                        </td>
                    </tr>
                    <tr th:if="${isStaffOrAdmin and (adminOrderList == null or #lists.isEmpty(adminOrderList))}">
                        <td colspan="6" class="text-center text-muted">No orders found.</td>
                    </tr>
                    </tbody>
                </table>

                <table class="table table-hover order-table" th:unless="${isStaffOrAdmin}">
                    <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Created Date</th>
                        <th>Final Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${customerOrders}">
                        <td th:text="${order.orderId}"></td>
                        <td th:text="${#dates.format(order.createdDate, 'dd/MM/yyyy')}"></td>
                        <td th:text="'$' + ${#numbers.formatInteger(order.finalAmount, 1, 'COMMA')}"></td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="${
                                    (order.status == 'Pending Payment' or order.status == 'Pending') ? ' status-pending' :
                                    order.status == 'Processing' ? ' status-processing' :
                                    order.status == 'Ready to Ship' ? ' status-ready' :
                                    order.status == 'Delivering' ? ' status-delivering' :
                                    order.status == 'Completed' ? ' status-completed' :
                                    order.status == 'Cancelled' ? ' status-cancelled' : ''
                                  }"
                                  th:text="${order.status ?: 'N/A'}">Status</span>
                        </td>
                        <td>
                            <a th:href="@{/orders/detail/{id}(id=${order.orderId})}" class="btn btn-app-outline btn-sm">View</a>
                        </td>
                    </tr>
                    <tr th:if="${!isStaffOrAdmin and (customerOrders == null or #lists.isEmpty(customerOrders))}">
                        <td colspan="5" class="text-center text-muted">You have no orders.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.7.0.js" th:if="${isStaffOrAdmin}"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js" th:if="${isStaffOrAdmin}"></script>

<script th:inline="none" th:if="${isStaffOrAdmin}">
    $(document).ready(function() {
        if (typeof $ !== 'undefined' && typeof $.fn.DataTable !== 'undefined' && $('#orderTable').length > 0) {
            $('#orderTable').DataTable({
                paging: true,
                info: true,
                lengthMenu: [[10, 25, 50, -1], [10, 25, 50, 'All']],
                order: [[2, 'desc']],
                columnDefs: [
                    { orderable: false, targets: [4, 5] }
                ]
            });
        }
    });
</script>
</th:block>
</body>
</html>

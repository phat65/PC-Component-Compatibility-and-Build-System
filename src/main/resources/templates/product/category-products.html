<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Category Products', null, ~{::content})}">
<body>
<th:block th:fragment="content">
<div class="storefront-page">
    <section class="page-section">
        <div class="container">
            <div class="section-header">
                <h1 class="section-title app-mb-0" th:text="'Category: ' + ${category.categoryName}">Category Name</h1>
                <a th:href="@{/products}" class="btn btn-app-outline">&larr; Back to All Products</a>
            </div>

            <div th:if="${products == null or #lists.isEmpty(products)}" class="empty-state-panel">
                <h3>No products in this category</h3>
                <p>Browse all products or choose another category.</p>
                <a th:href="@{/products}" class="btn btn-app-primary">Browse Products</a>
            </div>
            <div class="product-grid" th:unless="${products == null or #lists.isEmpty(products)}">
                <article class="product-card" th:each="p : ${products}"
                         th:with="imageUrl=${(p != null and p.images != null and !p.images.isEmpty() and p.images[0].imageUrl != null and !#strings.isEmpty(p.images[0].imageUrl)) ? p.images[0].imageUrl : '/images/no-image.svg'}">
                    <img th:src="@{${imageUrl}}"
                         th:attr="onerror=|this.onerror=null;this.src='@{/images/no-image.svg}';|"
                         alt="Product image"
                         class="product-card-image">
                    <div class="product-card-body">
                        <h3 class="product-card-title" th:text="${p.productName}">Product Name</h3>
                        <p class="product-price" th:text="'$' + ${p.price}">0.00</p>
                        <a th:href="@{/products/{id}(id=${p.productId})}"
                           class="btn btn-app-primary">View Details</a>
                    </div>
                </article>
            </div>

            <nav class="app-mt-5 text-center" aria-label="Category product pages" th:if="${pageNumbers != null}">
                <ul class="pagination">
                    <li class="page-item" th:each="i : ${pageNumbers}"
                        th:classappend="${i == currentPage} ? ' active' : ''">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{'/category/' + ${category.categoryId} + '?page=' + ${i}}">
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</div>
</th:block>
</body>
</html>

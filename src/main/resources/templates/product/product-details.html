<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page',
          ~{::main},
          ~{::page-styles},
          ${false}
      )}">
<head>
    <title th:text="${product.productName} + ' – PCOnlineShop'">Product Details</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/product-detail.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="page-section">
    <div class="page-container">

        <section class="product-detail">
            <div>
                <img id="mainImage"
                     th:if="${product.images != null and !product.images.isEmpty()}"
                     th:src="@{${product.images[0].imageUrl}}"
                     alt="Main product image"
                     class="product-detail__gallery-main">
                <img th:if="${product.images == null or product.images.isEmpty()}"
                     th:src="@{/images/no-image.svg}"
                     alt="No image"
                     class="product-detail__gallery-main">
                <div class="product-detail__thumbs" th:if="${product.images != null and !product.images.isEmpty()}">
                    <img th:each="img : ${product.images}"
                         th:src="@{${img.imageUrl}}"
                         alt="Thumbnail"
                         class="product-detail__thumb"
                         th:onclick="|setMainImage(this.src)|">
                </div>
            </div>

            <div>
                <h1 class="product-detail__name" th:text="${product.productName}">Product Name</h1>

                <div class="product-detail__rating">
                    <div class="product-detail__stars">
                        <span th:each="i : ${#numbers.sequence(1,5)}"
                              th:text="${i <= avgRating} ? '★' : '☆'"></span>
                    </div>
                    <span class="product-detail__rating-text">
                        <span th:text="${#numbers.formatDecimal(avgRating, 1, 1)}">0.0</span> / 5
                        (<span th:text="${feedbackCount}">0</span> reviews)
                    </span>
                </div>

                <p class="product-detail__price" th:text="'$' + ${product.price}">$0.00</p>
                <div class="product-detail__description" th:utext="${product.description}">Description</div>

                <div class="product-detail__meta">
                    <div class="meta-card">
                        <p class="meta-card__label">Category</p>
                        <p class="meta-card__value"
                           th:text="${!product.categories.isEmpty() ? product.categories[0].categoryName : 'N/A'}">N/A</p>
                    </div>
                    <div class="meta-card">
                        <p class="meta-card__label">Brand</p>
                        <p class="meta-card__value" th:text="${product.brand.name}">Brand</p>
                    </div>
                </div>

                <div class="product-detail__actions">
                    <form th:action="@{'/cart/add/' + ${product.productId}}" method="post" class="cart-form">
                        <label for="quantity">Qty</label>
                        <input type="number" id="quantity" name="quantity" value="1" min="1"
                               th:max="${product.inventoryQuantity ?: 1}"
                               required
                               th:disabled="${product.inventoryQuantity == null or product.inventoryQuantity <= 0}">
                        <button type="submit" class="btn-success"
                                th:disabled="${product.inventoryQuantity == null or product.inventoryQuantity <= 0}">
                            Add to Cart
                        </button>
                        <span th:if="${product.inventoryQuantity == null or product.inventoryQuantity <= 0}"
                              class="out-of-stock-msg">Out of stock</span>
                    </form>
                    <a th:href="@{/products}" class="btn-secondary">← Back to Products</a>
                </div>

                <div class="product-detail__stock">
                    <span th:if="${product.inventoryQuantity != null and product.inventoryQuantity > 0}"
                          class="stock-badge stock-badge--in">In Stock</span>
                    <span th:if="${product.inventoryQuantity == null or product.inventoryQuantity <= 0}"
                          class="stock-badge stock-badge--out">Out of Stock</span>
                </div>
            </div>
        </section>

        <section class="feedback-section">
            <h2 class="feedback-section__title">Customer Feedback</h2>

            <div th:if="${feedback_success}" class="alert alert--success" th:text="${feedback_success}"></div>
            <div th:if="${feedback_error}" class="alert alert--error" th:text="${feedback_error}"></div>

            <div th:if="${feedbackPage != null and feedbackPage.totalElements > 0}">
                <article th:each="fb : ${feedbackPage.content}" class="feedback-card">
                    <div class="feedback-card__header">
                        <div class="feedback-card__user">
                            <div class="feedback-card__avatar">
                                <span th:if="${fb.account != null}"
                                      th:text="${#strings.substring(fb.account.fullName, 0, 1)}">U</span>
                                <span th:unless="${fb.account != null}">U</span>
                            </div>
                            <div>
                                <p class="feedback-card__name"
                                   th:text="${fb.account != null ? fb.account.fullName : 'User'}">User</p>
                                <p class="feedback-card__date"
                                   th:text="${#temporals.format(fb.createdAt, 'dd/MM/yyyy HH:mm')}">Date</p>
                            </div>
                        </div>
                        <div class="feedback-card__stars">
                            <span th:each="i : ${#numbers.sequence(1,5)}"
                                  th:text="'★'"
                                  th:classappend="${i > fb.rating} ? ' is-empty' : ''"></span>
                        </div>
                    </div>
                    <p class="feedback-card__comment" th:text="${fb.comment}">Comment</p>
                    <div th:if="${fb.reply != null and !#strings.isEmpty(fb.reply)}" class="feedback-reply">
                        <p class="feedback-reply__label">Staff reply</p>
                        <p class="feedback-card__comment" th:text="${fb.reply}">Reply</p>
                    </div>
                </article>
            </div>

            <div th:if="${feedbackPage == null or feedbackPage.totalElements == 0}" class="feedback-empty">
                This product does not have any feedback yet.
            </div>

            <form th:action="@{/products/{id}(id=${product.productId})}"
                  method="post"
                  onsubmit="return validateFeedbackForm()"
                  class="feedback-form">
                <h3 class="feedback-form__title">Leave Your Feedback</h3>
                <p id="feedbackErrorMsg" class="feedback-form__error is-hidden"></p>

                <div class="filter-field feedback-form__field">
                    <label>Rating</label>
                    <div class="rating-input">
                        <input type="hidden" name="rating" id="ratingValue" value="">
                        <span data-value="1">★</span>
                        <span data-value="2">★</span>
                        <span data-value="3">★</span>
                        <span data-value="4">★</span>
                        <span data-value="5">★</span>
                    </div>
                </div>

                <div class="filter-field feedback-form__field">
                    <label for="comment">Your Comment</label>
                    <textarea id="comment" name="comment" rows="5" maxlength="500" required
                              placeholder="Share your thoughts about this product..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Send Feedback</button>
            </form>
        </section>

    </div>
    <script th:src="@{/js/pages/product-detail.js}"></script>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Add Product', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <section class="commerce-page admin-page">
        <div class="container">
            <div class="section-header">
                <h1 class="commerce-title app-mb-0">Add Product</h1>
                <a th:href="@{/staff/products/list}" class="btn btn-app-outline">Back</a>
            </div>

            <div class="commerce-card admin-form-card">
                <div class="product-gate">
                    <div class="form-group app-mb-0">
                        <label for="categorySelect">Primary Category</label>
                        <select id="categorySelect" class="form-control" required>
                            <option value="">-- Choose Primary Category --</option>
                            <option th:each="cat : ${categories}"
                                    th:if="${cat.displayOrder <= 10}"
                                    th:value="${cat.categoryId}"
                                    th:text="${cat.categoryName}"></option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-app-primary" id="btnStart">Continue</button>
                </div>
                <p id="gateMsg" class="help-block app-mb-0">Choose primary category to display the specification form.</p>
                <div class="text-danger" th:if="${categoryError}" th:text="${categoryError}"></div>
            </div>

            <form id="productForm" class="commerce-card admin-form-card app-mt-3"
                  th:action="@{/staff/products/save}"
                  th:object="${product}"
                  style="display:none"
                  method="post" enctype="multipart/form-data">

                <input type="hidden" id="primaryCategoryId" name="categoryIds">

                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="brand">Brand</label>
                            <select id="brand" name="brand.brandId" class="form-control" required>
                                <option value="">-- Choose brand --</option>
                                <option th:each="b : ${brands}" th:value="${b.brandId}" th:text="${b.name}"></option>
                            </select>
                            <div class="text-danger" th:if="${brandError}" th:text="${brandError}"></div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="lifecycleStatus">Lifecycle</label>
                            <select id="lifecycleStatus" th:field="*{lifecycleStatus}" class="form-control">
                                <option th:each="lifecycle : ${T(com.example.PCOnlineShop.model.product.ProductLifecycleStatus).values()}"
                                        th:value="${lifecycle}"
                                        th:text="${lifecycle.displayName}"></option>
                            </select>
                            <p class="help-block">Draft and Discontinued are automatically hidden from the storefront.</p>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="name">Product Name</label>
                    <input id="name" type="text" th:field="*{productName}" class="form-control"
                           placeholder="Example: ASUS PRIME B550M-A" minlength="3" maxlength="100" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></div>
                </div>

                <div class="row">
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="price">Price ($)</label>
                            <input id="price" type="number" th:field="*{price}" class="form-control" min="0.01" step="0.01" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="form-group">
                            <label for="inventory">Inventory</label>
                            <input id="inventory" type="number" th:field="*{inventoryQuantity}" class="form-control" min="0" step="1" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('inventoryQuantity')}" th:errors="*{inventoryQuantity}"></div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="desc">Description</label>
                    <textarea id="desc" th:field="*{description}" class="form-control" rows="4"
                              placeholder="Short product description"></textarea>
                </div>

                <div class="form-group">
                    <label for="status">Visibility</label>
                    <select id="status" th:field="*{status}" class="form-control">
                        <option th:value="true">Visible</option>
                        <option th:value="false">Hidden</option>
                    </select>
                </div>

                <div th:if="${specErrors != null and !specErrors.isEmpty()}" class="alert alert-danger">
                    <strong>Specification validation errors:</strong>
                    <ul class="app-mb-0 app-mt-2">
                        <li th:each="err : ${specErrors}" th:text="${err}"></li>
                    </ul>
                </div>

                <div class="form-group">
                    <label>Specification</label>
                    <div id="specFormContainer" class="spec-form-panel">
                        <p class="help-block app-mb-0">No spec form yet. Select a category first.</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>Images</label>
                    <input type="file" id="imageInput" name="imageFiles" accept="image/png, image/jpeg" multiple class="hidden">
                    <button type="button" class="btn btn-app-outline" onclick="document.getElementById('imageInput').click()">Choose Images</button>
                    <div class="product-image-preview" id="imagePreview">
                        <div class="product-image-thumb"><span class="help-block app-mb-0">No image yet</span></div>
                    </div>
                </div>

                <div class="admin-form-actions">
                    <a th:href="@{/staff/products/list}" class="btn btn-app-outline">Cancel</a>
                    <button type="submit" class="btn btn-app-primary">Create</button>
                </div>
            </form>
        </div>
    </section>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const submittedCatId = /*[[${submittedCategoryId}]]*/ null;
        const submittedBrandId = /*[[${submittedBrandId}]]*/ null;
        const categorySelectForReload = document.getElementById('categorySelect');
        const brandSelect = document.getElementById('brand');

        document.addEventListener('DOMContentLoaded', () => {
            if (submittedCatId) {
                categorySelectForReload.value = submittedCatId;
                if (submittedBrandId) {
                    brandSelect.value = submittedBrandId;
                }
                openFormWithCategory(submittedCatId, false);
            }
        });
        /*]]>*/
    </script>

    <script>
        const categorySelect = document.getElementById('categorySelect');
        const btnStart = document.getElementById('btnStart');
        const gateMsg = document.getElementById('gateMsg');
        const productForm = document.getElementById('productForm');
        const primaryCategoryId = document.getElementById('primaryCategoryId');
        const specContainer = document.getElementById('specFormContainer');
        const lifecycleSelect = document.getElementById('lifecycleStatus');
        const visibilitySelect = document.getElementById('status');

        function openFormWithCategory(cid, shouldScroll = true) {
            if (!cid) {
                productForm.style.display = 'none';
                gateMsg.textContent = 'Choose primary category to display the specification form.';
                specContainer.innerHTML = '<p class="help-block app-mb-0">No spec form yet. Select a category first.</p>';
                return;
            }

            primaryCategoryId.value = cid;
            productForm.style.display = 'block';
            gateMsg.textContent = 'Category selected. Fill in product details.';
            loadSpec(cid);

            if (shouldScroll) {
                productForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        btnStart.addEventListener('click', () => openFormWithCategory(categorySelect.value, true));

        categorySelect.addEventListener('change', () => {
            if (productForm.style.display === 'block') {
                openFormWithCategory(categorySelect.value, true);
            }
        });

        async function loadSpec(categoryId) {
            try {
                specContainer.innerHTML = '<p class="help-block app-mb-0">Loading specification form...</p>';
                const res = await fetch(`/staff/products/spec-form?categoryId=${categoryId}`);
                if (!res.ok) throw new Error('Network response was not ok');
                specContainer.innerHTML = await res.text();
            } catch (e) {
                console.error(e);
                specContainer.innerHTML = '<p class="text-danger app-mb-0">Error loading specification form.</p>';
            }
        }

        lifecycleSelect.addEventListener('change', () => {
            if (lifecycleSelect.value !== 'SELLING') {
                visibilitySelect.value = 'false';
            }
        });

        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        imageInput.addEventListener('change', (e) => {
            imagePreview.innerHTML = '';
            const files = Array.from(e.target.files);
            if (files.length === 0) {
                imagePreview.innerHTML = '<div class="product-image-thumb"><span class="help-block app-mb-0">No image yet</span></div>';
                return;
            }
            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const box = document.createElement('div');
                    box.className = 'product-image-thumb';
                    box.innerHTML = `<img src="${ev.target.result}" alt="preview">`;
                    imagePreview.appendChild(box);
                };
                reader.readAsDataURL(f);
            });
        });
    </script>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page',
          ~{::main},
          ~{::page-styles},
          ${false}
      )}">
<head>
    <title>PCOnlineShop - Products</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/product-list.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="page-section">
    <div class="page-container">
        <div class="page-title-row">
            <h1 class="page-title">PC Components and Gear</h1>
        </div>

        <form th:action="@{/products}" method="get" class="filter-panel">
            <div class="filter-field">
                <label for="filter-category">Category</label>
                <select id="filter-category" name="category">
                    <option value="">All</option>
                    <optgroup label="Components">
                        <option th:each="c : ${categories}"
                                th:value="${c.categoryId}"
                                th:text="${c.categoryName == 'Other' ? 'Gear' : c.categoryName}"
                                th:selected="${selectedCategory == c.categoryId}">
                        </option>
                    </optgroup>
                    <optgroup label="Gear" th:if="${gearCategories != null and !#lists.isEmpty(gearCategories)}">
                        <option th:each="gearCategory : ${gearCategories}"
                                th:value="${gearCategory.categoryId}"
                                th:text="${gearCategory.categoryName}"
                                th:selected="${selectedCategory == gearCategory.categoryId}">
                        </option>
                    </optgroup>
                </select>
            </div>

            <div class="filter-field">
                <label for="filter-brand">Brand</label>
                <select id="filter-brand" name="brand">
                    <option value="">All</option>
                    <option th:each="b : ${brands}"
                            th:value="${b.brandId}"
                            th:text="${b.name}"
                            th:selected="${selectedBrand == b.brandId}">
                    </option>
                </select>
            </div>

            <div class="filter-field">
                <label>Price Range ($)</label>
                <div class="price-range">
                    <input type="number" name="minPrice" th:value="${minPrice}" placeholder="Min">
                    <span class="price-range__sep">-</span>
                    <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="Max">
                </div>
            </div>

            <div class="filter-field">
                <label for="filter-sort">Sort by Price</label>
                <select id="filter-sort" name="sortDir">
                    <option value="asc" th:selected="${sortDir == 'asc'}">Low to High</option>
                    <option value="desc" th:selected="${sortDir == 'desc'}">High to Low</option>
                </select>
                <input type="hidden" name="sortField" value="price"/>
            </div>

            <div class="filter-field filter-field--grow">
                <label for="filter-keyword">Search</label>
                <input id="filter-keyword" type="text" name="keyword" th:value="${keyword}"
                       placeholder="Search products...">
            </div>

            <div class="filter-field">
                <label>&nbsp;</label>
                <button type="submit" class="btn-primary">Apply Filters</button>
            </div>
        </form>

        <div class="gear-category-strip"
             th:if="${gearParentCategory != null and gearCategories != null and !#lists.isEmpty(gearCategories) and gearCategorySelected}">
            <a th:href="@{/products(category=${gearParentCategory.categoryId})}"
               th:classappend="${selectedCategory == gearParentCategory.categoryId} ? ' is-active' : ''"
               class="gear-category-chip">All Gear</a>
            <a th:each="gearCategory : ${gearCategories}"
               th:href="@{/products(category=${gearCategory.categoryId})}"
               th:text="${gearCategory.categoryName}"
               th:classappend="${selectedCategory == gearCategory.categoryId} ? ' is-active' : ''"
               class="gear-category-chip">Gear</a>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="products-empty">
            No products found.
        </div>

        <div th:unless="${#lists.isEmpty(products)}" class="product-grid">
            <th:block th:each="p : ${products}">
                <th:block th:replace="~{layout/fragments/product-card :: product-card(item=${p})}" />
            </th:block>
        </div>

        <nav class="pagination" th:if="${pageNumbers != null and !#lists.isEmpty(pageNumbers)}">
            <a th:each="i : ${pageNumbers}"
               th:text="${i + 1}"
               th:href="@{/products(page=${i}, category=${selectedCategory}, brand=${selectedBrand}, minPrice=${minPrice}, maxPrice=${maxPrice}, keyword=${keyword}, sortDir=${sortDir}, sortField=${sortField})}"
               class="pagination__link"
               th:classappend="${i == currentPage} ? ' is-active' : ''"></a>
        </nav>
    </div>
</main>
</body>
</html>

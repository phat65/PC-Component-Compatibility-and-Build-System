<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('PCOnlineShop - Products', null, ~{::content})}">
<body>
<th:block th:fragment="content">
<div class="storefront-page">
    <section class="page-section">
        <div class="container">
            <h1 class="section-title">All Products</h1>

            <form th:action="@{/products}" method="get" class="filter-panel app-mb-4">
                <div class="row">
                    <div class="col-md-3 col-lg-2">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-control">
                            <option value="">All</option>
                            <option th:each="c : ${categories}"
                                    th:value="${c.categoryId}"
                                    th:text="${c.categoryName}"
                                    th:selected="${selectedCategory == c.categoryId}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3 col-lg-2">
                        <label class="form-label">Brand</label>
                        <select name="brand" class="form-control">
                            <option value="">All</option>
                            <option th:each="b : ${brands}"
                                    th:value="${b.brandId}"
                                    th:text="${b.name}"
                                    th:selected="${selectedBrand == b.brandId}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4 col-lg-3">
                        <label class="form-label">Price Range ($)</label>
                        <div class="input-group">
                            <input type="number" name="minPrice" th:value="${minPrice}" placeholder="Min"
                                   class="form-control">
                            <span class="input-group-addon">to</span>
                            <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="Max"
                                   class="form-control">
                        </div>
                    </div>

                    <div class="col-md-3 col-lg-2">
                        <label class="form-label">Sort by Price</label>
                        <select name="sortDir" class="form-control">
                            <option value="asc" th:selected="${sortDir == 'asc'}">Low to High</option>
                            <option value="desc" th:selected="${sortDir == 'desc'}">High to Low</option>
                        </select>
                        <input type="hidden" name="sortField" value="price"/>
                    </div>

                    <div class="col-md-6 col-lg-2">
                        <label class="form-label">Search</label>
                        <input type="text" name="keyword" th:value="${keyword}"
                               placeholder="Search products..." class="form-control">
                    </div>

                    <div class="col-md-2 col-lg-1">
                        <button type="submit" class="btn btn-app-primary btn-block">Apply</button>
                    </div>
                </div>
            </form>

            <div th:if="${products == null or #lists.isEmpty(products)}" class="empty-state-panel">
                <h3>No products found</h3>
                <p>Try changing your filters or search keyword.</p>
                <a th:href="@{/products}" class="btn btn-app-outline">Clear Filters</a>
            </div>
            <div class="product-grid" th:unless="${products == null or #lists.isEmpty(products)}">
                <article class="product-card" th:each="p : ${products}"
                         th:with="imageUrl=${(p != null and p.images != null and !p.images.isEmpty() and p.images[0].imageUrl != null and !#strings.isEmpty(p.images[0].imageUrl)) ? p.images[0].imageUrl : '/images/no-image.svg'}">
                    <img th:src="@{${imageUrl}}"
                         th:attr="onerror=|this.onerror=null;this.src='@{/images/no-image.svg}';|"
                         alt="Product image"
                         class="product-card-image">
                    <div class="product-card-body">
                        <h3 class="product-card-title" th:text="${p.productName}">Product Name</h3>
                        <p class="product-price" th:text="'$' + ${p.price}">0.00</p>
                        <a th:href="@{/products/{id}(id=${p.productId})}"
                           class="btn btn-app-primary">View Details</a>
                    </div>
                </article>
            </div>

            <nav class="app-mt-5 text-center" aria-label="Product pages" th:if="${pageNumbers != null}">
                <ul class="pagination">
                    <li class="page-item" th:each="i : ${pageNumbers}"
                        th:classappend="${i == currentPage} ? ' active' : ''">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{'/products?page=' + ${i}
                                + (${selectedCategory} != null ? '&category=' + ${selectedCategory} : '')
                                + (${selectedBrand} != null ? '&brand=' + ${selectedBrand} : '')
                                + (${minPrice} != null ? '&minPrice=' + ${minPrice} : '')
                                + (${maxPrice} != null ? '&maxPrice=' + ${maxPrice} : '')
                                + (${keyword} != null ? '&keyword=' + ${keyword} : '')
                                + '&sortDir=' + ${sortDir}}">
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</div>
</th:block>
</body>
</html>

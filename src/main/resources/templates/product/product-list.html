<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Product Management', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <section class="commerce-page admin-page">
        <div class="container">
            <div class="section-header">
                <h1 class="commerce-title app-mb-0">Product Management</h1>
                <a th:href="@{/staff/products/add}" class="btn btn-app-primary">Add Product</a>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <div class="commerce-card admin-table-card">
                <div class="admin-filter-bar product-filter-bar">
                    <div>
                        <label for="categoryFilter">Category</label>
                        <select id="categoryFilter" class="form-control">
                            <option value="">All</option>
                            <option th:each="c : ${categories}"
                                    th:value="${c.categoryName}"
                                    th:text="${c.categoryName}"></option>
                        </select>
                    </div>
                    <div>
                        <label for="brandFilter">Brand</label>
                        <select id="brandFilter" class="form-control">
                            <option value="">All</option>
                            <option th:each="b : ${brands}"
                                    th:value="${b.name}"
                                    th:text="${b.name}"></option>
                        </select>
                    </div>
                    <div>
                        <label for="statusFilter">Catalog State</label>
                        <select id="statusFilter" class="form-control">
                            <option value="">All</option>
                            <option value="Selling">Selling</option>
                            <option value="Draft">Draft</option>
                            <option value="Discontinued">Discontinued</option>
                            <option value="Visible">Visible</option>
                            <option value="Hidden">Hidden</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="productTable" class="table table-hover order-table admin-table product-admin-table" style="width:100%">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Category</th>
                            <th>Brand</th>
                            <th>Product Name</th>
                            <th>Price ($)</th>
                            <th>Inventory</th>
                            <th>Description</th>
                            <th>Catalog State</th>
                            <th class="admin-actions-col">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${products == null or #lists.isEmpty(products)}">
                            <td colspan="10" class="text-center text-muted">No results found</td>
                        </tr>

                        <tr th:each="product : ${products}">
                            <td th:text="${product.productId}"></td>
                            <td>
                                <img th:if="${product.images != null and !product.images.isEmpty()}"
                                     th:src="@{${product.images[0].imageUrl}}"
                                     alt="Product Image" class="product-admin-image">
                                <img th:if="${product.images == null or product.images.isEmpty()}"
                                     th:src="@{/image/default-product.png}"
                                     alt="No Image" class="product-admin-image">
                            </td>
                            <td th:text="${product.categories != null and !product.categories.isEmpty() ? product.categories[0].categoryName : 'N/A'}"></td>
                            <td th:text="${product.brand != null ? product.brand.name : 'N/A'}"></td>
                            <td>
                                <a class="product-link"
                                   th:href="@{/staff/products/edit/{id}(id=${product.productId})}"
                                   th:text="${product.productName}"></a>
                            </td>
                            <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${product.inventoryQuantity}"></td>
                            <td class="product-description-cell" th:text="${product.description}"></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${product.sellableOnStorefront ? ' status-completed' : ' status-cancelled'}"
                                      th:text="${product.lifecycleStatus.displayName + ' / ' + (product.status ? 'Visible' : 'Hidden')}"></span>
                            </td>
                            <td>
                                <div class="admin-row-actions">
                                    <a th:href="@{/staff/products/edit/{id}(id=${product.productId})}"
                                       class="btn btn-xs btn-app-primary">Edit</a>
                                    <form th:action="@{'/staff/products/' + ${product.productId} + '/hide'}" method="post"
                                          onsubmit="return confirm('Are you sure you want to stop selling and hide this product?');"
                                          class="admin-inline-form">
                                        <button type="submit" class="btn btn-warning btn-xs"
                                                th:disabled="${product.lifecycleStatus.name() == 'DISCONTINUED'}">
                                            Stop Selling
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script>
        $(document).ready(function() {
            var table = $('#productTable').DataTable({
                pageLength: 10,
                searching: true,
                ordering: true,
                lengthMenu: [5, 10, 25, 50],
                language: {
                    lengthMenu: 'Show _MENU_ products',
                    info: 'Showing _START_ to _END_ of _TOTAL_ products',
                    zeroRecords: 'No matching products found'
                }
            });

            $('#categoryFilter').on('change', function () {
                table.column(2).search(this.value).draw();
            });

            $('#brandFilter').on('change', function () {
                table.column(3).search(this.value).draw();
            });

            $('#statusFilter').on('change', function () {
                table.column(8).search(this.value).draw();
            });
        });
    </script>
</th:block>
</body>
</html>

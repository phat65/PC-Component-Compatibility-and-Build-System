<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('Update Product', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <section class="commerce-page admin-page">
        <div class="container">
            <div class="section-header">
                <h1 class="commerce-title app-mb-0">
                    Update Product: <span th:text="${product.productName}"></span>
                </h1>
                <a th:href="@{/staff/products/list}" class="btn btn-app-outline">Back</a>
            </div>

            <form class="commerce-card admin-form-card product-edit-form"
                  th:action="@{/staff/products/edit}"
                  th:object="${product}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{productId}">

                <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>

                <div class="row">
                    <div class="col-md-7">
                        <h3>Basic Information</h3>

                        <div class="form-group">
                            <label for="productName">Product Name</label>
                            <input type="text" class="form-control" id="productName" th:field="*{productName}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></div>
                        </div>

                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label for="price">Price ($)</label>
                                    <input type="number" class="form-control" id="price" th:field="*{price}" min="1" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label for="inventory">Inventory Quantity</label>
                                    <input type="number" class="form-control" id="inventory" th:field="*{inventoryQuantity}" min="0" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('inventoryQuantity')}" th:errors="*{inventoryQuantity}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label for="lifecycleStatus">Lifecycle</label>
                                    <select class="form-control" id="lifecycleStatus" th:field="*{lifecycleStatus}">
                                        <option th:each="lifecycle : ${T(com.example.PCOnlineShop.model.product.ProductLifecycleStatus).values()}"
                                                th:value="${lifecycle}"
                                                th:text="${lifecycle.displayName}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label for="status">Visibility</label>
                                    <select class="form-control" id="status" th:field="*{status}">
                                        <option th:value="true">Visible</option>
                                        <option th:value="false">Hidden</option>
                                    </select>
                                    <p class="help-block">Draft and Discontinued are automatically hidden from the storefront.</p>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="description">Detailed Description</label>
                            <textarea class="form-control" id="description" rows="8" th:field="*{description}"></textarea>
                        </div>

                        <h3>Image Management</h3>
                        <div class="form-group">
                            <label for="imageFiles">Add New Images</label>
                            <input class="form-control" type="file" id="imageFiles" name="imageFiles" multiple>
                        </div>

                        <div class="form-group">
                            <label>Current Images</label>
                            <div class="product-image-preview" id="image-preview-container">
                                <div th:each="img : *{images}"
                                     class="product-image-thumb product-existing-image"
                                     th:id="'image-item-' + ${img.imageId}">
                                    <img th:src="@{${img.imageUrl}}" alt="Product Image">
                                    <button type="button"
                                            class="btn btn-danger btn-xs delete-image-btn"
                                            th:data-image-id="${img.imageId}">
                                        X
                                    </button>
                                </div>
                                <div th:if="${#lists.isEmpty(product.images)}" class="text-muted">
                                    This product has no images.
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <h3>Classification & Specs</h3>

                        <div class="form-group">
                            <label for="brand">Brand</label>
                            <select id="brand" class="form-control" th:field="*{brand.brandId}" required>
                                <option value="">-- Choose Brand --</option>
                                <option th:each="b : ${brands}"
                                        th:value="${b.brandId}"
                                        th:text="${b.name}"
                                        th:disabled="${!b.status}">
                                </option>
                            </select>
                            <div class="text-danger" th:if="${brandError}" th:text="${brandError}"></div>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <input type="text" class="form-control" id="category"
                                   th:value="${!product.categories.isEmpty() ? product.categories[0].categoryName : 'N/A'}" readonly>
                        </div>

                        <div class="form-group">
                            <label>Technical Specifications</label>
                            <div id="spec-form-container" class="spec-form-panel">
                                <p class="help-block app-mb-0">Loading specifications...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="admin-form-actions">
                    <a th:href="@{/staff/products/list}" class="btn btn-app-outline">Cancel</a>
                    <button type="submit" class="btn btn-app-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </section>

    <script th:inline="javascript">
        /*<![CDATA[*/

        const productId = /*[[${product.productId}]]*/ 0;
        const initialCategoryId = /*[[${!product.categories.isEmpty() ? product.categories[0].categoryId : 0}]]*/ 0;

        function getCsrfToken() {
            const match = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]+)/);
            return match ? decodeURIComponent(match[1]) : '';
        }

        function withCsrfHeaders(headers) {
            const csrfToken = getCsrfToken();
            if (!csrfToken) {
                return headers;
            }

            return {
                ...headers,
                'X-XSRF-TOKEN': csrfToken
            };
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadSpecFormForEdit(initialCategoryId, productId);
            syncVisibilityWithLifecycle();

            const imageContainer = document.getElementById('image-preview-container');
            imageContainer.addEventListener('click', function(event) {
                if (event.target.classList.contains('delete-image-btn')) {
                    event.preventDefault();
                    const button = event.target;
                    const imageId = button.getAttribute('data-image-id');

                    if (confirm('Are you sure you want to delete this image immediately?')) {
                        deleteImage(imageId, button);
                    }
                }
            });

            document.getElementById('lifecycleStatus').addEventListener('change', syncVisibilityWithLifecycle);
        });

        function syncVisibilityWithLifecycle() {
            const lifecycleSelect = document.getElementById('lifecycleStatus');
            const visibilitySelect = document.getElementById('status');
            if (lifecycleSelect.value !== 'SELLING') {
                visibilitySelect.value = 'false';
            }
        }

        async function loadSpecFormForEdit(categoryId, prodId) {
            const container = document.getElementById('spec-form-container');
            container.innerHTML = '<p class="help-block app-mb-0">Loading specifications...</p>';
            try {
                const url = `/staff/products/spec-form-edit?categoryId=${categoryId}&productId=${prodId}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                container.innerHTML = await response.text();
            } catch (error) {
                console.error('Error loading specs (edit):', error);
                container.innerHTML = '<div class="alert alert-danger app-mb-0">Could not load specifications.</div>';
            }
        }

        async function deleteImage(imageId, button) {
            try {
                const url = `/staff/products/image/${imageId}`;
                const response = await fetch(url, {
                    method: 'DELETE',
                    headers: withCsrfHeaders({ 'Accept': 'application/json' })
                });

                if (response.ok) {
                    button.closest('.product-existing-image').remove();
                    alert('Image deleted successfully.');
                } else {
                    throw new Error('Could not delete image.');
                }
            } catch (error) {
                console.error('Error deleting image:', error);
                alert('An error occurred while deleting the image.');
            }
        }

        /*]]>*/
    </script>
</th:block>
</body>
</html>

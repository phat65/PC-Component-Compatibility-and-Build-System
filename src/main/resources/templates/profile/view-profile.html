<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>

<body>


<div sec:authorize="!isAuthenticated()"
     th:replace="~{layout/header-default :: header-default}"></div>
<div sec:authorize="hasRole('ADMIN')"
     th:replace="~{layout/header-admin :: header-admin}"></div>
<div sec:authorize="hasRole('STAFF')"
     th:replace="~{layout/header-staff :: header-staff}"></div>
<div sec:authorize="hasRole('CUSTOMER')"
     th:replace="~{layout/header-customer :: header-customer}"></div>


<div class="profile-wrapper">


    <div class="password-container">
        <h2>🔑 Change Password</h2>

        <div th:if="${pwdSuccess}" class="message success" th:text="${pwdSuccess}"></div>
        <div th:if="${pwdError}" class="message error" th:text="${pwdError}"></div>

        <form th:action="@{/profile/change-password}" method="post">
            <div class="form-group">
                <label>Current Password:</label>
                <input type="password" name="currentPassword"  required>
            </div>

            <div class="form-group">
                <label>New Password:</label>
                <input type="password" name="newPassword" required>
            </div>

            <div class="form-group">
                <label>Confirm Password:</label>
                <input type="password" name="confirmPassword"  required>
            </div>

            <button type="submit">Change Password</button>
        </form>
    </div>

    <!-- Form profile -->
    <div class="profile-container">
        <h2>👤 User Profile</h2>

        <div th:if="${success}" class="message success">✅ <span th:text="${success}"></span></div>
        <div th:if="${error}" class="message error">❌ <span th:text="${error}"></span></div>

        <form th:action="@{/profile/update}" method="post" th:object="${account}">
            <div class="form-group">
                <label>Họ:</label>
                <input type="text" th:field="*{lastname}" >
            </div>

            <div class="form-group">
                <label>Name:</label>
                <input type="text" th:field="*{firstname}">
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" readonly>
            </div>

            <div class="form-group">
                <label>Phone Number:</label>
                <input type="text" th:field="*{phoneNumber}" readonly>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <select th:field="*{gender}">
                    <option value="true">Male</option>
                    <option value="false">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label>Addresses:</label>
                <ul>
                    <li th:each="addr : ${addresses}" th:text="${addr.address}"></li>
                </ul>
            </div>

            <button type="submit">💾 Save</button>
        </form>
    </div>

</div>

</body>
</html>

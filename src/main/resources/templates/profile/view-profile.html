<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base-storefront :: storefront(
          ~{::title},
          'storefront-page page-profile',
          ~{::main},
          ~{::page-styles},
          ${false}
      )}">
<head>
    <title>My Profile – PCOnlineShop</title>
    <th:block th:fragment="page-styles">
        <link rel="stylesheet" th:href="@{/css/pages/profile.css}">
    </th:block>
</head>
<body>
<main th:fragment="main" class="profile-main">
    <div class="profile-wrapper">

        <div class="profile-page-header">
            <p class="profile-page-header__eyebrow">Account</p>
            <h1 class="profile-page-header__title">My Profile</h1>
        </div>

        <div class="profile-grid">

            <!-- Change Password -->
            <div class="profile-card">
                <h2 class="profile-card__title">Change Password</h2>

                <div th:if="${pwdSuccess}" class="profile-alert profile-alert--success" th:text="${pwdSuccess}"></div>
                <div th:if="${pwdError}"   class="profile-alert profile-alert--error"   th:text="${pwdError}"></div>

                <form th:action="@{/profile/change-password}" method="post">
                    <div class="profile-form__group">
                        <label class="profile-form__label">Current Password</label>
                        <input class="profile-form__input" type="password"
                               name="currentPassword" placeholder="Current password" required>
                    </div>
                    <div class="profile-form__group">
                        <label class="profile-form__label">New Password</label>
                        <input class="profile-form__input" type="password"
                               name="newPassword" placeholder="New password" required>
                    </div>
                    <div class="profile-form__group">
                        <label class="profile-form__label">Confirm Password</label>
                        <input class="profile-form__input" type="password"
                               name="confirmPassword" placeholder="Repeat new password" required>
                    </div>
                    <button type="submit" class="profile-form__submit">Update Password</button>
                </form>
            </div>

            <!-- Edit Profile -->
            <div class="profile-card">
                <h2 class="profile-card__title">Profile Details</h2>

                <div th:if="${success}" class="profile-alert profile-alert--success" th:text="${success}"></div>
                <div th:if="${error}"   class="profile-alert profile-alert--error"   th:text="${error}"></div>

                <form th:action="@{/profile/update}" method="post" th:object="${account}">
                    <div class="profile-form__group">
                        <label class="profile-form__label">Last Name</label>
                        <input class="profile-form__input" type="text"
                               th:field="*{lastname}" placeholder="Last name">
                    </div>
                    <div class="profile-form__group">
                        <label class="profile-form__label">First Name</label>
                        <input class="profile-form__input" type="text"
                               th:field="*{firstname}" placeholder="First name">
                    </div>
                    <div class="profile-form__group">
                        <label class="profile-form__label">Email</label>
                        <input class="profile-form__input" type="email"
                               th:field="*{email}" readonly>
                    </div>
                    <div class="profile-form__group">
                        <label class="profile-form__label">Phone Number</label>
                        <input class="profile-form__input" type="text"
                               th:field="*{phoneNumber}" readonly>
                    </div>
                    <div class="profile-form__group">
                        <label class="profile-form__label">Gender</label>
                        <select class="profile-form__select" th:field="*{gender}">
                            <option value="true">Male</option>
                            <option value="false">Female</option>
                        </select>
                    </div>
                    <div class="profile-form__group">
                        <label class="profile-form__label">Addresses</label>
                        <ul class="profile-address-list">
                            <li th:each="addr : ${addresses}" th:text="${addr.address}"></li>
                        </ul>
                    </div>
                    <button type="submit" class="profile-form__submit">Save Changes</button>
                </form>
            </div>

        </div>
    </div>
</main>
</body>
</html>

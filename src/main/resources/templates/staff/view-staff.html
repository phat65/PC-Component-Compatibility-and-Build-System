<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/app :: page('View Staff', null, ~{::content})}">
<body>
<th:block th:fragment="content">
    <section class="commerce-page admin-page">
        <div class="container">
            <div class="section-header">
                <h1 class="commerce-title app-mb-0">View Staff</h1>
                <a th:href="@{/staff/list}" class="btn btn-app-outline">Back</a>
            </div>

            <div class="commerce-card admin-detail-card">
                <div class="admin-detail-grid">
                    <div class="admin-detail-row">
                        <span>ID</span>
                        <strong th:text="${account.accountId}"></strong>
                    </div>
                    <div class="admin-detail-row">
                        <span>First Name</span>
                        <strong th:text="${account.firstname}"></strong>
                    </div>
                    <div class="admin-detail-row">
                        <span>Last Name</span>
                        <strong th:text="${account.lastname}"></strong>
                    </div>
                    <div class="admin-detail-row">
                        <span>Email</span>
                        <strong th:text="${account.email}"></strong>
                    </div>
                    <div class="admin-detail-row">
                        <span>Phone</span>
                        <strong th:text="${account.phoneNumber}"></strong>
                    </div>
                    <div class="admin-detail-row admin-detail-row-full">
                        <span>Address</span>
                        <strong th:text="${account.defaultAddress}"></strong>
                    </div>
                    <div class="admin-detail-row">
                        <span>Status</span>
                        <strong>
                            <span class="status-badge"
                                  th:classappend="${account.enabled} ? ' status-completed' : ' status-cancelled'"
                                  th:text="${account.enabled ? 'Active' : 'Inactive'}"></span>
                        </strong>
                    </div>
                </div>
            </div>
        </div>
    </section>
</th:block>
</body>
</html>
